<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#2F4B7C">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%232F4B7C'/%3E%3Ctext x='32' y='45' font-size='40' text-anchor='middle' fill='%23fff' font-family='sans-serif'%3E&#26085;%3C/text%3E%3C/svg%3E">
<title>日本語 — Japanese study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* ─────────────────────────────────────────────────────────────────────────────
   Japanese study app — design tokens
   Palette: cool paper neutrals, indigo (藍) as the working accent, vermilion (朱)
   reserved strictly for errors, moss for correct. Semantic colour never doubles
   as decoration, so "wrong" always reads as wrong.
   ───────────────────────────────────────────────────────────────────────────*/
:root {
  --bg: #F1F2F5;
  --surface: #FFFFFF;
  --surface-2: #E8EAEF;
  --line: #D9DCE3;
  --line-soft: #E6E8ED;
  --text: #15181D;
  --text-soft: #474D57;
  --muted: #767D89;
  --accent: #2F4B7C;
  --accent-ink: #FFFFFF;
  --accent-soft: #E4EAF5;
  --ok: #2C6A45;
  --ok-soft: #E0F0E6;
  --bad: #AE382A;
  --bad-soft: #F8E5E1;
  --focus: #2F4B7C;
  --shadow: 0 1px 2px rgba(21,24,29,.05), 0 10px 28px -18px rgba(21,24,29,.35);
  --radius: 10px;
  --radius-sm: 7px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1216;
    --surface: #171B21;
    --surface-2: #1F242C;
    --line: #2B313A;
    --line-soft: #242A32;
    --text: #E9ECF1;
    --text-soft: #B7BDC7;
    --muted: #7F8794;
    --accent: #82A8E2;
    --accent-ink: #0F1216;
    --accent-soft: #1A2540;
    --ok: #74C193;
    --ok-soft: #14291E;
    --bad: #E2806D;
    --bad-soft: #331A15;
    --focus: #82A8E2;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"] {
  --bg: #0F1216;
  --surface: #171B21;
  --surface-2: #1F242C;
  --line: #2B313A;
  --line-soft: #242A32;
  --text: #E9ECF1;
  --text-soft: #B7BDC7;
  --muted: #7F8794;
  --accent: #82A8E2;
  --accent-ink: #0F1216;
  --accent-soft: #1A2540;
  --ok: #74C193;
  --ok-soft: #14291E;
  --bad: #E2806D;
  --bad-soft: #331A15;
  --focus: #82A8E2;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.8);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, -apple-system, sans-serif;
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}
.jp { font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
/* <main> is focused programmatically on navigation so screen readers land in the new
   screen — that move should not paint a focus ring around the whole page. */
.main:focus, .main:focus-visible { outline: none; }
a { color: inherit; text-decoration: none; }
h1, h2, h3 { margin: 0; line-height: 1.22; text-wrap: balance; }
h1 { font-size: clamp(1.5rem, 4.5vw, 2rem); font-weight: 700; letter-spacing: -.01em; }
h2 { font-size: 1.06rem; font-weight: 700; }
h3 { font-size: 1rem; font-weight: 700; }
p { margin: 0; }

/* ── layout ─────────────────────────────────────────────────────────────── */
#app { min-height: 100dvh; }
.main {
  padding: 1rem 1rem calc(5.5rem + env(safe-area-inset-bottom));
  max-width: 62rem;
  margin: 0 auto;
}
.screen { display: flex; flex-direction: column; gap: 1.1rem; }
.screen-head { display: flex; flex-direction: column; gap: .3rem; }
.eyebrow { font-size: .7rem; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.lede { color: var(--text-soft); font-size: .95rem; max-width: 58ch; }
.sec-head { display: flex; flex-direction: column; gap: .2rem; margin-bottom: .35rem; }
.sec-sub { font-size: .86rem; color: var(--muted); max-width: 60ch; }
.prose { color: var(--text-soft); max-width: 64ch; }
.prose strong { color: var(--text); font-weight: 700; }
.footnote { font-size: .8rem; color: var(--muted); max-width: 60ch; }
.warn-note { font-size: .85rem; color: var(--bad); background: var(--bad-soft); padding: .7rem .9rem; border-radius: var(--radius-sm); }
.streak-note { font-size: .82rem; color: var(--muted); text-align: center; }

.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  padding: .55rem 1rem; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); border-bottom: 1px solid var(--line-soft);
}
.sidebar { display: none; }
.brand { display: flex; align-items: baseline; gap: .45rem; }
.brand-jp { font-size: 1.12rem; font-weight: 700; letter-spacing: .02em; }
.brand-sub { font-size: .68rem; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.topbar-actions { display: flex; gap: .15rem; }
.icon-nav { display: grid; place-items: center; width: 2.25rem; height: 2.25rem; border-radius: var(--radius-sm); color: var(--muted); }
.icon-nav svg { width: 19px; height: 19px; }
.icon-nav .nav-label, .icon-nav .nav-badge { display: none; }
.icon-nav[aria-current="page"] { color: var(--text); background: var(--surface-2); }

.bottomnav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: color-mix(in srgb, var(--surface) 94%, transparent);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  padding: .3rem .25rem calc(.3rem + env(safe-area-inset-bottom));
}
.bottomnav .nav-item {
  display: flex; flex-direction: column; align-items: center; gap: .12rem;
  padding: .4rem .2rem; color: var(--muted); font-size: .68rem; position: relative;
  border-radius: var(--radius-sm);
}
.bottomnav .nav-item svg { width: 21px; height: 21px; }
.bottomnav .nav-item[aria-current="page"] { color: var(--accent); }
.nav-badge {
  position: absolute; top: .15rem; right: 50%; transform: translateX(1.05rem);
  background: var(--accent); color: var(--accent-ink);
  font-size: .6rem; font-weight: 700; line-height: 1;
  padding: .16rem .3rem; border-radius: 999px; min-width: 1.05rem; text-align: center;
}

@media (min-width: 900px) {
  .topbar, .bottomnav { display: none; }
  .sidebar {
    display: flex; flex-direction: column; gap: 1.5rem;
    position: fixed; inset: 0 auto 0 0; width: 14.5rem;
    padding: 1.4rem 1rem; border-right: 1px solid var(--line);
    background: var(--surface);
  }
  .sidebar .brand { margin-bottom: .25rem; }
  .nav-group { display: flex; flex-direction: column; gap: .12rem; }
  .nav-group.secondary { margin-top: auto; border-top: 1px solid var(--line-soft); padding-top: .8rem; }
  .sidebar .nav-item {
    display: flex; align-items: center; gap: .65rem; position: relative;
    padding: .5rem .65rem; border-radius: var(--radius-sm);
    color: var(--text-soft); font-size: .92rem;
  }
  .sidebar .nav-item svg { width: 18px; height: 18px; }
  .sidebar .nav-item:hover { background: var(--surface-2); }
  .sidebar .nav-item[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  .sidebar .nav-badge { position: static; transform: none; margin-left: auto; }
  .main { margin-left: 14.5rem; padding: 2rem 2rem 4rem; max-width: 58rem; }
}

/* ── cards & primitives ─────────────────────────────────────────────────── */
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 1.05rem 1.1rem;
  display: flex; flex-direction: column; gap: .8rem;
}
.grid { display: grid; gap: .7rem; }
.grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.btn {
  border: 1px solid var(--line); background: var(--surface); color: var(--text);
  border-radius: var(--radius-sm); padding: .62rem 1.05rem; font-size: .93rem; font-weight: 500;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.danger { background: transparent; border-color: var(--bad); color: var(--bad); }
.btn.full { width: 100%; }
.btn[disabled] { opacity: .45; cursor: default; }
.btn.file { position: relative; overflow: hidden; display: inline-flex; align-items: center; }
.btn.file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.icon-btn {
  border: 1px solid var(--line); background: transparent; color: var(--muted);
  border-radius: var(--radius-sm); width: 2rem; height: 2rem; display: grid; place-items: center; flex: none;
}
.icon-btn svg { width: 16px; height: 16px; }
.icon-btn:hover { color: var(--text); border-color: var(--muted); }
.pill {
  font-size: .68rem; letter-spacing: .06em; text-transform: uppercase;
  color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: .05rem .45rem;
}
.meter { display: block; height: 5px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.meter-row { display: flex; flex-direction: column; gap: .35rem; }
.meter-label { font-size: .78rem; color: var(--muted); }
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(6.2rem, 1fr)); gap: .6rem; }
.stat { display: flex; flex-direction: column; gap: .05rem; }
.stat-value { font-size: 1.32rem; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.stat-label { font-size: .74rem; color: var(--muted); }
.stat-sub { font-size: .68rem; color: var(--muted); opacity: .8; }

/* ── home ───────────────────────────────────────────────────────────────── */
.hero {
  display: flex; flex-direction: column; gap: .25rem; text-align: left;
  background: var(--accent); color: var(--accent-ink);
  border: none; border-radius: var(--radius); padding: 1.15rem 1.2rem;
  box-shadow: var(--shadow);
}
.hero:hover { filter: brightness(1.06); }
.hero.done { background: var(--surface); color: var(--text); border: 1px solid var(--line); }
.hero-eyebrow { font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; opacity: .78; }
.hero-title { font-size: 1.24rem; font-weight: 700; line-height: 1.25; }
.hero-sub { font-size: .88rem; opacity: .85; }
.hero-go { font-size: .85rem; font-weight: 700; margin-top: .45rem; }
.action {
  display: flex; flex-direction: column; gap: .1rem; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: .9rem 1rem;
}
.action:hover { border-color: var(--muted); }
.action.accent { border-color: var(--accent); }
.action-value { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; display: flex; align-items: center; min-height: 1.76rem; }
.action-value svg { width: 22px; height: 22px; color: var(--muted); }
.action.accent .action-value { color: var(--accent); }
.action-label { font-size: .86rem; font-weight: 500; }
.action-sub { font-size: .74rem; color: var(--muted); }
.weak-list { display: flex; flex-direction: column; gap: .5rem; }
.weak-item { display: flex; align-items: center; gap: .7rem; }
.weak-glyph { font-size: 1.35rem; width: 2rem; text-align: center; flex: none; }
.weak-meta { display: flex; flex-direction: column; }
.weak-name { font-size: .9rem; }
.weak-rate { font-size: .74rem; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ── learn ──────────────────────────────────────────────────────────────── */
.stage-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-top: .6rem; }
.stage-count { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.lesson-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .35rem; }
.unit-label { font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: .7rem 0 .1rem; }
.lesson-row {
  width: 100%; display: flex; align-items: center; gap: .8rem; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: .7rem .85rem;
}
.lesson-row:hover { border-color: var(--muted); }
.lesson-row.next { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.lesson-row.done .lesson-num { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.lesson-row.locked { opacity: .62; }
.lesson-num {
  flex: none; width: 1.85rem; height: 1.85rem; border-radius: 50%;
  display: grid; place-items: center; font-size: .8rem; font-weight: 700;
  border: 1px solid var(--line); color: var(--muted); font-variant-numeric: tabular-nums;
}
.lesson-row.next .lesson-num { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.lesson-body { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.lesson-title { font-size: .93rem; font-weight: 500; }
.lesson-sub { font-size: .76rem; color: var(--muted); }
.lesson-meta { font-size: .74rem; color: var(--muted); flex: none; font-variant-numeric: tabular-nums; }
.back { background: none; border: none; padding: 0; color: var(--muted); font-size: .82rem; align-self: flex-start; }
.back:hover { color: var(--text); }

/* ── lesson content ─────────────────────────────────────────────────────── */
.lesson .screen-head { gap: .35rem; }
.tip {
  background: var(--accent-soft); border-radius: var(--radius-sm);
  padding: .8rem .95rem; display: flex; flex-direction: column; gap: .2rem;
}
.tip-title { font-size: .84rem; font-weight: 700; }
.tip-body { font-size: .88rem; color: var(--text-soft); }
:root[data-theme="dark"] .tip-body, :root:not([data-theme="light"]) .tip-body { color: var(--text-soft); }
.kana-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(4.1rem, 1fr)); gap: .4rem; }
.kana-cell {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: .6rem .3rem .45rem; display: flex; flex-direction: column; align-items: center; gap: .1rem; position: relative;
}
.kana-glyph { font-size: 1.72rem; line-height: 1.1; }
.kana-romaji { font-size: .7rem; color: var(--muted); letter-spacing: .05em; }
.kana-note { position: absolute; top: .2rem; right: .35rem; color: var(--accent); font-size: .8rem; line-height: 1; }
.kana-known { position: absolute; top: .25rem; right: .3rem; font-size: .45rem; color: var(--ok); }
.vocab-list { display: flex; flex-direction: column; gap: .1rem; }
.vocab-row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .5rem 1rem; align-items: center;
  padding: .62rem .1rem; border-bottom: 1px solid var(--line-soft);
}
.vocab-row:last-child { border-bottom: 0; }
.vocab-main { display: flex; align-items: baseline; gap: .5rem; flex-wrap: wrap; min-width: 0; }
.vocab-word { font-size: 1.14rem; font-weight: 500; }
.vocab-reading { font-size: .84rem; color: var(--muted); }
.vocab-romaji { font-size: .74rem; color: var(--muted); opacity: .78; }
.vocab-side { display: flex; align-items: center; gap: .45rem; justify-content: flex-end; }
.vocab-meaning { font-size: .88rem; color: var(--text-soft); text-align: right; }
.vocab-note { grid-column: 1 / -1; font-size: .8rem; color: var(--muted); margin-top: -.15rem; }
.kanji-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(9rem, 1fr)); gap: .5rem; }
.kanji-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: .8rem; display: flex; flex-direction: column; gap: .15rem;
}
.kanji-char { font-size: 2.4rem; line-height: 1.05; }
.kanji-meaning { font-size: .88rem; font-weight: 500; }
.kanji-readings { font-size: .76rem; color: var(--muted); }
.kanji-strokes { font-size: .7rem; color: var(--muted); opacity: .8; }
.kanji-note { font-size: .76rem; color: var(--text-soft); margin-top: .3rem; }
.grammar-card {
  background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent);
  border-radius: var(--radius-sm); padding: .95rem 1.05rem; display: flex; flex-direction: column; gap: .35rem;
}
.grammar-pattern { font-size: .82rem; color: var(--accent); letter-spacing: .02em; }
.grammar-gloss { font-size: .86rem; color: var(--muted); }
.grammar-pitfall { font-size: .84rem; color: var(--text-soft); border-top: 1px solid var(--line-soft); padding-top: .5rem; margin-top: .2rem; }
.sentence-list { display: flex; flex-direction: column; gap: .1rem; }
.sentence-row {
  display: flex; align-items: flex-start; gap: .6rem; justify-content: space-between;
  padding: .62rem .1rem; border-bottom: 1px solid var(--line-soft);
}
.sentence-row:last-child { border-bottom: 0; }
.sentence-main { display: flex; flex-direction: column; gap: .05rem; min-width: 0; }
.sentence-jp { font-size: 1.06rem; }
.sentence-reading { font-size: .78rem; color: var(--muted); }
.sentence-en { font-size: .86rem; color: var(--text-soft); }
.sentence-note { font-size: .78rem; color: var(--muted); margin-top: .2rem; }
.lesson-actions { margin-top: .6rem; }
.lesson-done {
  margin-top: 1.2rem; padding-top: 1.1rem; border-top: 1px solid var(--line);
  display: flex; flex-direction: column; gap: .3rem; align-items: center; text-align: center;
}
.done-title { font-size: 1.05rem; font-weight: 700; }
.done-sub { font-size: .86rem; color: var(--muted); }
.done-actions { display: flex; gap: .5rem; flex-wrap: wrap; justify-content: center; margin-top: .6rem; }

.counter-block { display: flex; flex-direction: column; gap: .8rem; }
.counter-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: .9rem 1rem; display: flex; flex-direction: column; gap: .65rem;
}
.counter-head { display: flex; align-items: center; gap: .8rem; }
.counter-glyph { font-size: 2.1rem; line-height: 1; }
.counter-meta { display: flex; flex-direction: column; }
.counter-reading { font-size: .95rem; }
.counter-counts { font-size: .78rem; color: var(--muted); }
.counter-forms { display: grid; grid-template-columns: repeat(auto-fill, minmax(5.2rem, 1fr)); gap: .35rem; }
.counter-form {
  display: flex; flex-direction: column; align-items: center; gap: .05rem;
  padding: .4rem .2rem; border: 1px solid var(--line-soft); border-radius: var(--radius-sm);
  background: var(--bg);
}
.counter-form.irregular { border-color: var(--accent); background: var(--accent-soft); }
.counter-form.question { border-style: dashed; }
.cf-form { font-size: 1rem; }
.cf-reading { font-size: .72rem; color: var(--muted); }
.counter-form.irregular .cf-reading { color: var(--accent); font-weight: 700; }
.counter-note { font-size: .84rem; color: var(--text-soft); }
.counter-legend { font-size: .74rem; color: var(--muted); }

.conj-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); }
table.conj { border-collapse: collapse; width: 100%; min-width: 32rem; font-size: .9rem; }
table.conj th {
  text-align: left; font-size: .68rem; letter-spacing: .12em; text-transform: uppercase;
  color: var(--muted); font-weight: 500; padding: .6rem .7rem; border-bottom: 1px solid var(--line); white-space: nowrap;
}
table.conj td { padding: .55rem .7rem; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
table.conj tr:last-child td { border-bottom: 0; }
.conj-word { font-size: 1.06rem; white-space: nowrap; }
.conj-reading { display: block; font-size: .72rem; color: var(--muted); }
.conj-group { font-size: .74rem; color: var(--muted); white-space: nowrap; }
.conj-mean { color: var(--text-soft); font-size: .84rem; }
.conj-te { font-size: 1.06rem; color: var(--accent); font-weight: 500; white-space: nowrap; }

/* ── exercises ──────────────────────────────────────────────────────────── */
.exercise {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 1rem 1.05rem 1.15rem; display: flex; flex-direction: column; gap: .85rem;
}

  wrap.append(host);
  clear(root).append(wrap);

  const exercises = buildSession(due.slice(0, SESSION_CAP).map(i => i.id), {
    limit: SESSION_CAP, allowTyping: true, allowAudio: canListen() && storage.state.settings.audio,
  });
  runExercises(host, exercises, {
    title: 'Review',
    note: backlog ? `${backlog} more due after this session` : null,
    onDone: () => {
      const left = SRS.dueCount();
      host.append(el('div', { class: 'lesson-done' },
        el('p', { class: 'done-title' }, 'Review finished'),
        el('p', { class: 'done-sub' }, left
          ? `${left} still due — including anything you just missed, which comes back almost immediately.`
          : 'Queue clear. Nothing else is due right now.'),
        el('div', { class: 'done-actions' },
          left ? el('button', { class: 'btn primary', type: 'button', onclick: () => renderReview(root, nav) }, `Next ${Math.min(SESSION_CAP, left)}`) : null,
          el('button', { class: 'btn ghost', type: 'button', onclick: () => nav('#/') }, 'Home'))));
    },
  });
}

function relativeTime(ts) {
  const diff = ts - Date.now();
  if (diff <= 0) return 'now';
  const h = Math.round(diff / 3600000);
  if (h < 1) return 'in under an hour';
  if (h < 24) return `in about ${h} hour${h === 1 ? '' : 's'}`;
  const d = Math.round(h / 24);
  return `in about ${d} day${d === 1 ? '' : 's'}`;
}

// ── PRACTICE ─────────────────────────────────────────────────────────────────

// Top-level practice modes. Translation and matching still exist as exercise generators —
// mixed lesson and review sessions use them for variety — but neither is strong enough on its
// own to earn a place in the menu.
const PRACTICE_MODES = [
  { id: 'kana-hiragana', name: 'Hiragana', sub: 'Recognition, recall and typing' },
  { id: 'kana-katakana', name: 'Katakana', sub: 'Including the confusable pairs' },
  { id: 'vocabulary',    name: 'Vocabulary', sub: 'Both directions, plus readings' },
  { id: 'kanji',         name: 'Kanji', sub: 'Meaning and reading, through words' },
  { id: 'grammar',       name: 'Grammar', sub: 'Patterns in whole sentences' },
  { id: 'particles',     name: 'Particles', sub: 'Fill the gap in a real sentence' },
  { id: 'build',         name: 'Sentence building', sub: 'Assemble it from pieces' },
  { id: 'listening',     name: 'Listening', sub: 'Hear it, then choose', audio: true },
  { id: 'weak',          name: 'Weak areas', sub: 'Only what you keep missing' },
];

function renderPractice(root, nav, mode) {
  if (!mode) return renderPracticeMenu(root, nav);
  const wrap = el('div', { class: 'screen' });
  const conf = PRACTICE_MODES.find(m => m.id === mode);
  wrap.append(el('header', { class: 'screen-head' },
    el('button', { class: 'back', type: 'button', onclick: () => nav('#/practice') }, '← Practice'),
    el('h1', {}, conf?.name || 'Practice')));

  const exercises = buildPractice(mode);
  const host = el('div', {});
  wrap.append(host);
  clear(root).append(wrap);

  if (!exercises.length) {
    clear(host).append(card(
      el('p', { class: 'prose' }, mode === 'weak'
        ? 'No weak areas yet — you need a few more answers on record before the app can tell what you are actually struggling with.'
        : 'Nothing to practise here yet. Complete the lessons that introduce this material first.'),
      el('button', { class: 'btn primary full', type: 'button', onclick: () => nav('#/learn') }, 'Go to lessons')));
    return;
  }
  runExercises(host, exercises, {
    title: conf?.name || 'Practice',
    onDone: () => host.append(el('div', { class: 'lesson-done' },
      el('div', { class: 'done-actions' },
        el('button', { class: 'btn primary', type: 'button', onclick: () => renderPractice(root, nav, mode) }, 'Again'),
        el('button', { class: 'btn ghost', type: 'button', onclick: () => nav('#/practice') }, 'Other modes')))),
  });
}

function buildPractice(mode) {
  const opts = { limit: 12, allowTyping: true, allowAudio: canListen() && storage.state.settings.audio };
  const isIntroduced = SRS.isIntroduced;

  if (mode === 'weak') {
    const weak = SRS.weakItems(3, 0.7).map(i => i.id);
    return buildSession(weak, opts);
  }
  if (mode === 'particles') {
    const g = GRAMMAR.map(x => x.id).filter(isIntroduced);
    const out = [];
    for (let i = 0; i < 12; i++) { const ex = particleDrill(g); if (ex) out.push(ex); }
    return dedupeByPrompt(out);
  }
  if (mode === 'matching') {
    const pool = [...practicePool('kana-hiragana', { isIntroduced }), ...practicePool('vocabulary', { isIntroduced }), ...practicePool('kanji', { isIntroduced })];
    if (pool.length < 4) return [];
    return Array.from({ length: 5 }, () => makeMatching(pool, 4)).filter(Boolean);
  }
  if (mode === 'build' || mode === 'translate' || mode === 'listening') {
    const g = GRAMMAR.map(x => x.id).filter(isIntroduced);
    if (!g.length) return [];
    if (mode === 'listening' && !canListen()) return [];
    const out = [];
    for (const id of shuffle([...g, ...g])) {
      if (out.length >= 12) break;
      const ex = exerciseFor(id, opts);
      if (!ex) continue;
      if (mode === 'build' && ex.kind !== 'sentence-build') continue;
      if (mode === 'translate' && ex.kind !== 'translate') continue;
      if (mode === 'listening' && ex.kind !== 'listening') continue;
      out.push(ex);
    }
    // Fall back to any grammar exercise rather than showing an empty screen.
    return out.length ? out : buildSession(g, opts);
  }
  const pool = practicePool(mode, { isIntroduced });
  return buildSession(pool, opts);
}

const dedupeByPrompt = list => {
  const seenKeys = new Set();
  return list.filter(x => {
    const k = (x.prompt?.before || '') + '|' + (x.prompt?.after || '') + '|' + x.answer;
    if (seenKeys.has(k)) return false;
    seenKeys.add(k);
    return true;
  });
};

function renderPracticeMenu(root, nav) {
  const wrap = el('div', { class: 'screen' });

    el('p', { class: 'eyebrow' }, 'Free practice'),
    el('h1', {}, 'Practice'),
    el('p', { class: 'lede' }, 'Practice never changes your review schedule for the worse — but it does record what you got right and wrong.')));

  const grid = el('div', { class: 'mode-grid' });
  for (const m of PRACTICE_MODES) {
    const disabled = m.audio && !canListen();
    grid.append(el('button', {
      class: 'mode' + (disabled ? ' disabled' : ''), type: 'button',
      disabled: disabled || false,
      onclick: () => nav(`#/practice/${m.id}`),
    },
      el('span', { class: 'mode-name' }, m.name),

// ── PROGRESS ─────────────────────────────────────────────────────────────────

function renderActivity(s) {

    const d = new Date(Date.now() - i * 86400000);
    const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    days.push({ key, ...(s.stats.days[key] || { answers: 0, correct: 0 }) });
  }

    el('p', { class: 'meter-label' }, 'Last 28 days'),
    el('div', { class: 'activity-bars' }, ...days.map(d =>
      el('span', {

// ── REFERENCE ────────────────────────────────────────────────────────────────

function renderReference(root) {

    class: 'tab', type: 'button', 'aria-pressed': String(id === tab),
    onclick: e => { tab = id; for (const b of tabs.children) b.setAttribute('aria-pressed', String(b === e.currentTarget)); draw(); },
  }, name)));

  wrap.append(
    el('header', { class: 'screen-head' },
      el('p', { class: 'eyebrow' }, 'Reference'),
      el('h1', {}, 'Everything you have met'),
      el('p', { class: 'lede' }, 'Items you have been introduced to. Search by kanji, kana, romaji or English.')),
    search, tabs, results);

  function draw() {
    clear(results);
    const q = query;
    const match = (...fields) => !q || fields.filter(Boolean).some(f => String(f).toLowerCase().includes(q));

    if (tab === 'vocab') {
      const list = VOCABULARY.filter(v => SRS.isIntroduced(v.id))
        .filter(v => match(v.word, v.reading, toRomaji(v.reading), ...v.meanings));
      if (!list.length) return results.append(emptyRef(q));
      for (const v of list) {
        results.append(el('article', { class: 'ref-card' },
          el('div', { class: 'ref-top' },
            el('span', { class: 'ref-jp jp' }, v.word),
            v.reading !== v.word ? el('span', { class: 'ref-reading jp' }, v.reading) : null,
            el('span', { class: 'ref-romaji' }, toRomaji(v.reading)),
            speakButton(v.reading)),
          el('p', { class: 'ref-meaning' }, v.meanings.join(', ')),
          el('p', { class: 'ref-tags' }, [v.pos, v.register, ...(v.tags || [])].filter(Boolean).join(' · ')),
          v.note ? el('p', { class: 'ref-note' }, v.note) : null,
          exampleFor(v.id)));
      }
    } else if (tab === 'kanji') {
      const list = KANJI.filter(k => SRS.isIntroduced(k.id))
        .filter(k => match(k.char, ...k.meanings, ...k.on, ...k.kun));
      if (!list.length) return results.append(emptyRef(q));
      for (const k of list) {

          el('div', { class: 'ref-top' },
            el('span', { class: 'ref-kanji jp' }, k.char),

      const list = GRAMMAR.filter(g => SRS.isIntroduced(g.id))

      : 'Nothing here yet — finish a lesson and its material will appear.');
  }
  function exampleFor(vid) {
    const s = Object.values(SENTENCES_BY_ID).find(x => x.vocab?.includes(vid));
    if (!s) return null;
    return el('div', { class: 'ref-example' },
      el('p', { class: 'sentence-jp jp' }, s.jp),
      el('p', { class: 'sentence-en' }, s.en));

  clear(root).append(wrap);

    })));

  wrap.append(card(
    sectionHead('Romaji', 'Romaji is a crutch. The default removes it from each kana as soon as you know that kana.'),
    radioGroup('Show romaji', ['always', 'fade', 'never'], s.settings.romaji, v => {
      storage.update(st => { st.settings.romaji = v; });

  wrap.append(card(

    sectionHead('Your data', storage.persistent

    el('div', { class: 'settings-actions' },

      el('label', { class: 'btn ghost file' }, 'Import progress',
        el('input', { type: 'file', accept: 'application/json', onchange: importData })),
      el('button', { class: 'btn danger', type: 'button', onclick: () => resetAll(nav) }, 'Reset everything'))));

  wrap.append(el('p', { class: 'footnote' },
    `${KANA.length} kana · ${VOCABULARY.length} words · ${KANJI.length} kanji · ${GRAMMAR.length} grammar points · ${LESSONS.length} lessons. `
    + 'Example sentences were written for this app; kana, readings and grammar explanations are checked by an automated content validator before release.'));

function radioGroup(label, values, current, onChange, labels = {}) {
  const row = el('div', { class: 'radio-row', role: 'group', 'aria-label': label });
  for (const v of values) {
    const b = el('button', { class: 'radio', type: 'button', 'aria-pressed': String(v === current) },
      labels[v] || v);
    b.addEventListener('click', () => {
      for (const o of row.children) o.setAttribute('aria-pressed', String(o === b));
      onChange(v);

}

function toggle(label, value, onChange, disabled) {
  const b = el('button', {
    class: 'switch', type: 'button', role: 'switch', 'aria-checked': String(!!value),
    disabled: disabled || false,
  }, el('span', { class: 'knob' }));
  b.addEventListener('click', () => {
    const v = b.getAttribute('aria-checked') !== 'true';
    b.setAttribute('aria-checked', String(v));
    onChange(v);
  });
  return el('div', { class: 'setting' }, el('p', { class: 'setting-label' }, label), b);
}

function exportData() {
  const blob = new Blob([storage.export()], { type: 'application/json' });
  const a = el('a', { href: URL.createObjectURL(blob), download: 'japanese-progress.json' });
  document.body.append(a); a.click(); a.remove();
}

function importData(e) {
  const file = e.target.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try { storage.import(String(reader.result)); location.reload(); }
    catch { alert('That file could not be read as progress data.'); }

  if (!confirm('Delete all progress? This cannot be undone.')) return;
  storage.reset();
  nav('#/');
  location.reload();
}

__def("content/grammar.js", function(__req, __exports){
// Foundational grammar. Each point carries a plain-language explanation, the pattern,
// and the mistakes English speakers actually make — not a formal linguistics description.

const GRAMMAR = [
  { id:'g:desu', title:'X は Y です', gloss:'X is Y', pattern:'[topic] は [noun] です',
    explain:'です is the polite way of saying "is". は marks what you are talking about — the topic — and is pronounced **wa** here, not ha. The predicate always comes last in Japanese, so the thing being said about the topic arrives at the end of the sentence.',
    examples:['s:001','s:002','s:003'],
    pitfalls:'After a noun, です is the copula and carries tense and negation: 学生でした, 学生じゃない. After an い-adjective it is only politeness, which is why 高いでした is wrong while 学生でした is fine.' },

  { id:'g:janai', title:'じゃないです', gloss:'is not', pattern:'[noun] じゃないです',
    explain:'The negative of です. じゃないです is the everyday polite form; ではありません is more formal and more common in writing.',
    examples:['s:004','s:005'], pitfalls:'じゃありません is also correct and sits between the two in formality.' },

  { id:'g:ka', title:'か — questions', gloss:'turns a statement into a question', pattern:'[sentence] か',
    explain:'Add か to the end. Word order does not change, and in writing a question mark is optional — か is doing that job.',
    examples:['s:006','s:007'], pitfalls:'In speech, casual questions often drop か and just use rising intonation: 学生？' },

  { id:'g:no', title:'の — possession and connection', gloss:'’s / of', pattern:'[A] の [B]',
    explain:'A modifies B. Usually possession (私の本 = my book), but it also connects any two nouns: 日本の車, 大学の先生.',
    examples:['s:008','s:009'], pitfalls:'The order matches English “Tanaka’s book” exactly — owner first. It is only reversed against the *of* pattern, “the book of Tanaka”.' },

  { id:'g:mo', title:'も — also', gloss:'too, also', pattern:'[noun] も',
    explain:'も replaces は, が **and** を — it never stacks with them. 私も学生です, never 私はも. ラーメンも食べます, never ラーメンをも.',
    examples:['s:010','s:011'], pitfalls:'It does stack with the other particles: 日本にも行きます, ここでも使えます, 友達とも話します. Only は, が and を get displaced.' },

  { id:'g:kore', title:'これ・それ・あれ', gloss:'this / that / that over there', pattern:'これ は [noun] です',
    explain:'Japanese splits "that" in two: それ is near the listener, あれ is away from both of you. これ is near you.',
    examples:['s:012','s:013','s:014'], pitfalls:'These stand alone as pronouns. To attach them to a noun you need この／その／あの.' },

  { id:'g:kono', title:'この・その・あの', gloss:'this ~ / that ~', pattern:'この [noun]',
    explain:'Same three-way distance system, but these attach to a noun: この本 = this book.',
    examples:['s:015','s:016'], pitfalls:'これ本 is wrong. これ is a pronoun; この needs a noun after it.' },

  { id:'g:koko', title:'ここ・そこ・あそこ', gloss:'here / there / over there', pattern:'[place] は ここ です',
    explain:'The same distance logic applied to places.',
    examples:['s:017','s:018'] },

  { id:'g:masu', title:'ます — polite verbs', gloss:'present and future, polite', pattern:'[verb stem] ます',
    explain:'The ます form is polite **non-past** — it covers both present and future, and Japanese does not separate them. 行きます can be "I go" or "I will go"; context decides.',
    examples:['s:019','s:020','s:021'],
    pitfalls:'Two traps. There is no separate future tense to hunt for — and ます is not progressive either: 今食べます is not "I am eating now" (that is 食べています, which comes with the て-form).' },

  { id:'g:masen', title:'ません — polite negative', gloss:'do not / will not', pattern:'[verb stem] ません',
    explain:'Swap ます for ません.',
    examples:['s:022','s:023'] },

  { id:'g:wo', title:'を — the object particle', gloss:'marks what the verb acts on', pattern:'[object] を [verb]',
    explain:'Marks the thing being eaten, read, bought, watched. Written を but pronounced **o** — this is the only job this kana has.',
    examples:['s:024','s:025','s:026'],
    pitfalls:'Some English transitive verbs take が in Japanese: 分かる and 好き both do.' },

  { id:'g:ni_he', title:'に・へ — destination', gloss:'to', pattern:'[place] に 行きます',
    explain:'Both mark where you are going. に is the default and is also used for arrival points and times; へ emphasises the direction of travel and is written へ but pronounced **e**.',
    examples:['s:027','s:028','s:029'],
    pitfalls:'For time, the test is not how specific the word is — it is whether the time is fixed by the clock or calendar, or anchored to "now". Clock and calendar times take に: 七時に, 月曜日に, 三月に, 週末に. Times measured from the present moment take nothing at all: 今日, 明日, 昨日, 毎日, 来週. 明日に行きます is wrong even though 明日 is perfectly specific.' },

  { id:'g:de', title:'で — where the action happens', gloss:'at, in, by means of', pattern:'[place] で [verb]',
    explain:'で marks where an action takes place, and also the means: バスで行きます. に marks existence and destination; で marks activity.',
    examples:['s:030','s:031','s:032'],
    pitfalls:'家にいます (I am at home — existence) vs 家で食べます (I eat at home — action). This pair is the classic particle mistake.' },

  { id:'g:iadj', title:'い-adjectives', gloss:'describing things', pattern:'[i-adj] [noun] / [noun] は [i-adj] です',
    explain:'These end in い and conjugate themselves. The negative drops the い and adds くない: 高い → 高くないです.',
    examples:['s:033','s:034','s:035'],
    pitfalls:'Never 高いじゃないです. And いい is irregular — よくないです.' },

  { id:'g:naadj', title:'な-adjectives', gloss:'describing things', pattern:'[na-adj] な [noun] / [noun] は [na-adj] です',
    explain:'These behave like nouns. They need な before a noun (静かな部屋) and negate like nouns (静かじゃないです).',
    examples:['s:036','s:037'],
    pitfalls:'きれい and 有名 end in い but are な-adjectives. The ending is not a reliable test — you learn which is which.' },

  { id:'g:aruiru', title:'ある・いる — existence', gloss:'there is / to have', pattern:'[place] に [thing] が あります',
    explain:'ある for inanimate things, いる for people and animals. The thing that exists is marked with が.',
    examples:['s:038','s:039','s:040'],
    pitfalls:'Choosing by animacy, not by grammar. A car uses ある even though it moves; a cat uses いる.' },

  { id:'g:suki', title:'好き — liking things', gloss:'to like', pattern:'[thing] が 好きです',
    explain:'好き is an adjective, not a verb, so the thing you like takes が: 音楽が好きです — literally "music is liked".',
    examples:['s:041','s:042'],
    pitfalls:'音楽を好きです is wrong. 嫌い, 上手 and 下手 are な-adjectives that work identically. 分かる takes が too, but for a different reason — it is a verb describing a state rather than an action you perform on something.' },

  { id:'g:mashita', title:'ました・ませんでした', gloss:'polite past', pattern:'[verb stem] ました',
    explain:'ます → ました for the past, ません → ませんでした for the past negative.',
    examples:['s:043','s:044','s:045'] },

  // ── The て-form and what it unlocks ───────────────────────────────────────
  { id:'g:te', title:'The て-form — る-verbs and irregulars', gloss:'the connector form of a verb', pattern:'[る-verb] − る + て',
    explain:'The て-form is not a tense — it is a **connector**. On its own it means nothing; attached to something else it becomes requests, permission, prohibition, actions in progress and joined sentences. Learning it is the single biggest step in beginner Japanese, because half a dozen structures wait on the other side of it.\n\nThe easy half first. **る-verbs**: drop る, add て — 食べる → 食べて, 見る → 見て. **The two irregulars**: する → して, 来る → 来て (read きて).',
    examples:['s:147','s:148','s:117'],
    pitfalls:'These two verbs are the whole of Group 3 — Japanese has only two irregular verb *groups*, which is why textbooks make so much of it. (A handful of other verbs are irregular in one specific form: ある has the negative ない, and 行く has an irregular て-form you will meet next lesson.)' },

  { id:'g:te_u', title:'The て-form — う-verbs', gloss:'five endings and one exception', pattern:'[う-verb] → って / んで / いて / いで / して',
    explain:'For う-verbs the dictionary-form ending decides the て-form ending. There are five patterns and they are worth memorising as a block:\n\n**う・つ・る → って**　·　**む・ぶ・ぬ → んで**　·　**く → いて**　·　**ぐ → いで**　·　**す → して**',
    examples:['s:113', 's:111', 's:116'],
    pitfalls:'One exception matters: 行く becomes **行って**, not 行いて. It is the only common く-verb that breaks the rule, and it is a very frequent verb. Watch out too for 帰る and 入る — they end in える／いる but are う-verbs: 帰って, 入って.' },

  { id:'g:tekudasai', title:'〜てください', gloss:'please do ~', pattern:'[て-form] ください',
    explain:'The workhorse request. Polite and neutral — fine with strangers, shopkeepers and colleagues.',
    examples:['s:147','s:148','s:117'],
    pitfalls:'It is a directive, not a plea — a doctor uses it with patients, a teacher with students. That also means it does not point *upward*: asking a boss or a customer for a favour wants 〜ていただけますか instead. To ask for an *object* rather than an action, use を ください: 水をください.' },

  { id:'g:teimasu', title:'〜ています', gloss:'is doing ~ / is in the state of ~', pattern:'[て-form] います',
    explain:'Two jobs. First, an action in progress right now: 今食べています — "I am eating." Second, an ongoing situation rather than a momentary act — 住んでいます "I live (there)", 働いています "I work (there)". A small group of verbs describe an instant change and use ています for the state it left behind: 結婚しています "I am married", 知っています "I know".',
    examples:['s:118','s:119','s:122'],
    pitfalls:'This is the form English speakers keep reaching for and not finding. 食べます is not "I am eating" — it is "I eat" or "I will eat". If the action is in progress, you need ています.' },

  { id:'g:temoii', title:'〜てもいいですか', gloss:'may I ~?', pattern:'[て-form] も いいです か',
    explain:'Literally "even if I do X, is it good?" — which is how Japanese asks permission. Drop the か and it grants permission instead: 食べてもいいです, "you may eat".',
    examples:['s:125','s:126','s:130'],
    pitfalls:'はい、どうぞ is the warmest way to say yes. Beware the opposite trap: a bare いいです or 結構です, with no はい in front, is how Japanese politely **declines** an offer — 「袋いりますか」「いいです」means "no thanks", not "yes please".' },

  { id:'g:tewaikemasen', title:'〜てはいけません', gloss:'must not ~', pattern:'[て-form] は いけません',
    explain:'A firm prohibition — rules, instructions, an adult to a child. It is the direct opposite of 〜てもいいです.',
    examples:['s:131','s:132','s:134'],
    pitfalls:'Strong enough that using it on someone your own age sounds high-handed. Between friends it contracts: て-forms become 〜ちゃだめ and で-forms become 〜じゃだめ — 飲んではいけません → 飲んじゃだめ, never 飲んちゃだめ. Real signage rarely uses this form at all; it prefers 〜ないでください or a bare 禁止 (立入禁止, 撮影禁止).' },

  { id:'g:teconnect', title:'Connecting actions with て', gloss:'do X, then Y', pattern:'[て-form]、[next clause]',
    explain:'End every clause but the last in て, and let the final verb carry the tense for all of them. 朝起きて、朝ご飯を食べます — "I get up and eat breakfast." Change the last verb to past and the whole sequence becomes past.',
    examples:['s:136','s:139','s:143'],

  // ── connectors and counting ───────────────────────────────────────────────
  { id:'g:to', title:'と — and, with', gloss:'joins nouns, or names who you did it with', pattern:'[noun] と [noun]　·　[person] と [verb]',
    explain:'Two uses, and they feel like one idea: と puts two things side by side.\n\n**Joining nouns** — 卵と野菜 "eggs and vegetables". Unlike English "and", it joins *nouns only*, and it implies the list is complete.\n\n**Doing something with someone** — 友達と食べます "I eat with a friend". The person comes first, then と, then the verb.',
    examples:['s:104','s:107','s:153'],
    pitfalls:'と cannot join sentences or verbs. "I ate and went home" is the て-form (食べて、帰りました), never 食べたと. For an open-ended list — "coffee, tea, that sort of thing" — Japanese uses や instead, which implies there is more you did not mention.' },

  { id:'g:counters', title:'Counting things', gloss:'numbers need a counter word', pattern:'[number] + [counter]',
    explain:'You cannot say "three" and stop. Japanese attaches a **counter** chosen for the shape or kind of thing: 三人 three people, 三枚 three sheets, 三本 three bottles, 三台 three machines.\n\nEnglish does this in a small way — "two *slices* of bread", "three *head* of cattle" — but Japanese does it for everything, and the number and counter often fuse into a sound neither of them has alone: 一分 is いっぷん, not いちふん.',
    examples:['s:070','s:074','s:154'],
    pitfalls:'When you cannot remember the right counter, use つ — ひとつ, ふたつ, みっつ. It is the general-purpose fallback for objects and nobody will blink. It only goes up to ten, and it never counts people: that is always 人.' },

  // ── the plain form and what it unlocks ────────────────────────────────────
  { id:'g:plain', title:'The plain (dictionary) form', gloss:'the base form of a verb', pattern:'食べます ↔ 食べる　·　行きます ↔ 行く',
    explain:'Every verb you have learned has been in its ます-form. The **plain form** is the same verb with the politeness stripped out — and it is the form dictionaries list, which is why it is also called the dictionary form.\n\n**る-verbs**: ます → る. 食べます → 食べる.\n**う-verbs**: the い-row syllable shifts back to the う-row. 行きます → 行く, 飲みます → 飲む, 話します → 話す, 買います → 買う.\n**Irregulars**: します → する, 来ます(きます) → 来る(くる).',
    examples:['s:165','s:166','s:174'],
    pitfalls:'Plain is not "slang" and polite is not "correct". Plain is the **base** form: it is what goes before と思います, before ことができます, and inside a clause modifying a noun — including in the most formal writing imaginable. Register is only one of its jobs.' },

  { id:'g:casual', title:'Casual speech', gloss:'plain form as register', pattern:'[plain form] (?)',
    explain:'Between friends, family and people your own age, sentences simply end in the plain form. Questions drop か and rise in pitch instead: 明日行く？ — "going tomorrow?". です disappears too: これ、おいしい rather than これはおいしいです.',
    examples:['s:165','s:166','s:168'],
    pitfalls:'Getting this wrong downward is far worse than upward. Casual with a stranger, a shopkeeper or anyone older reads as rude; polite with a close friend reads as cold or sarcastic, which is awkward but survivable. When unsure, stay polite and let the other person drop first.' },

  { id:'g:toomou', title:'〜と思います', gloss:'I think that ~', pattern:'[plain clause] と 思います',
    explain:'This is the third job of と: **quotation**. It marks the end of a thought or something said, and what comes before it is always in the plain form — even when the sentence itself is polite.',
    examples:['s:170','s:171','s:173'],
    pitfalls:'The clause before と never takes ます. 難しいですと思います is wrong; it is 難しいと思います. Note too that Japanese uses this far more than English uses "I think" — asserting a bare opinion without it can sound blunt.' },

  { id:'g:dekiru', title:'〜ことができます', gloss:'can do ~ / is able to', pattern:'[plain form] こと が できます',
    explain:'こと turns a verb into a thing — "the act of speaking Japanese" — and できます says that thing is possible. 日本語を話すことができます: "I can speak Japanese."',
    examples:['s:174','s:175','s:176'],
    pitfalls:'The verb before こと must be plain: 話すこと, never 話しますこと. There is a shorter potential form (話せます) that native speakers use more often in conversation; this longer pattern is clearer while you are learning and is never wrong.' },

  { id:'g:relative', title:'Clauses that describe a noun', gloss:'the ~ that ~', pattern:'[plain clause] [noun]',
    explain:'English needs a relative pronoun — "the person **who** speaks Japanese". Japanese needs nothing at all: the clause goes straight in front of the noun, with its verb in the plain form. 日本語を話す人.\n\nThis is the single biggest structural difference from English, and it is why Japanese sentences can feel back-to-front: the description arrives before the thing it describes.',
    examples:['s:177','s:178','s:179'],
    pitfalls:'Inside the clause, は is normally replaced by が: 兄**が**住んでいる町. は marks the topic of the whole sentence, and a modifying clause is not a sentence.' },

  { id:'g:nai', title:'The ない-form and 〜ないでください', gloss:'plain negative, and please don’t', pattern:'[ない-form] で ください',
    explain:'The plain negative. **る-verbs** drop る and add ない: 食べる → 食べない. **う-verbs** shift the final syllable to the あ-row: 飲む → 飲まない, 行く → 行かない — with う becoming **わ**, not あ: 買う → 買わない. **Irregulars**: する → しない, 来る → 来ない (こない).\n\nAdd でください and you have a polite negative request: 写真を撮らないでください.',

    pitfalls:'ある is suppletive — its negative is simply **ない**, never あらない. And 〜ないでください is much softer than 〜てはいけません: it asks, where the other forbids, which is why signage and staff use it far more often.' },
];

  { id:'s:071', jp:'これは日本のお茶です。', reading:'これはにほんのおちゃです。', en:'This is Japanese tea.', parts:['これは','日本の','お茶','です'], grammar:['g:no','g:kore','g:desu'], vocab:['v:nihon','v:ocha'], register:'polite' },
  { id:'s:072', jp:'あそこにバスが来ます。', reading:'あそこにバスがきます。', en:'The bus comes over there.', parts:['あそこに','バスが','来ます'], grammar:['g:ni_he','g:masu'], vocab:['v:asoko','v:basu','v:kuru'], register:'polite', note:'ます is non-past, not progressive. For a bus arriving right now a speaker would say バスが来ましたよ.' },
  { id:'s:073', jp:'私の部屋は小さいです。', reading:'わたしのへやはちいさいです。', en:'My room is small.', parts:['私の','部屋は','小さい','です'], grammar:['g:no','g:iadj','g:desu'], vocab:['v:heya','v:chiisai'], register:'polite' },
  { id:'s:074', jp:'ビールを二つお願いします。', reading:'ビールをふたつおねがいします。', en:'Two beers, please.', parts:['ビールを','二つ','お願いします'], grammar:['g:wo','g:masu','g:counters'], vocab:['v:biiru','v:onegaishimasu'], register:'polite' },
  { id:'s:075', jp:'この町はとても静かです。', reading:'このまちはとてもしずかです。', en:'This town is very quiet.', parts:['この','町は','とても','静か','です'], grammar:['g:naadj','g:kono','g:desu','g:ka'], vocab:['v:machi','v:totemo','v:shizuka'], register:'polite' },
  { id:'s:076', jp:'元気ですか。', reading:'げんきですか。', en:'Are you well?', parts:['元気','ですか'], grammar:['g:ka','g:naadj'], vocab:['v:genki'], register:'polite', note:'Not the all-purpose English “how are you?” — it asks after someone you have not seen for a while. お元気ですか is the polite form.' },
  { id:'s:077', jp:'はい、元気です。', reading:'はい、げんきです。', en:'Yes, I’m well.', parts:['はい、','元気','です'], grammar:['g:desu'], vocab:['v:hai','v:genki'], register:'polite' },
  { id:'s:078', jp:'いいえ、違います。', reading:'いいえ、ちがいます。', en:'No, that’s not right.', parts:['いいえ、','違います'], grammar:['g:masu'], vocab:['v:iie'], register:'polite' },
  { id:'s:079', jp:'昨日は何を食べましたか。', reading:'きのうはなにをたべましたか。', en:'What did you eat yesterday?', parts:['昨日は','何を','食べましたか'], grammar:['g:mashita','g:ka','g:wo','g:desu'], vocab:['v:kinou','v:nani','v:taberu'], register:'polite' },
  { id:'s:080', jp:'ラーメンを食べました。', reading:'ラーメンをたべました。', en:'I ate ramen.', parts:['ラーメンを','食べました'], grammar:['g:mashita','g:wo'], vocab:['v:raamen','v:taberu'], register:'polite' },
  { id:'s:081', jp:'その傘は誰のですか。', reading:'そのかさはだれのですか。', en:'Whose umbrella is that?', parts:['その','傘は','誰の','ですか'], grammar:['g:no','g:ka','g:kono','g:desu'], vocab:['v:kasa','v:dare'], register:'polite' },
  { id:'s:082', jp:'私のです。', reading:'わたしのです。', en:'It’s mine.', parts:['私の','です'], grammar:['g:no'], vocab:['v:watashi'], register:'polite' },
  { id:'s:083', jp:'明日も学校に行きます。', reading:'あしたもがっこうにいきます。', en:'I’m going to school tomorrow too.', parts:['明日も','学校に','行きます'], grammar:['g:mo','g:ni_he','g:masu'], vocab:['v:ashita','v:gakkou','v:iku'], register:'polite' },
  { id:'s:084', jp:'一緒に行きませんか。', reading:'いっしょにいきませんか。', en:'Would you like to go together?', parts:['一緒に','行きませんか'], grammar:['g:masen','g:ka','g:ni_he'], vocab:['v:issho','v:iku'], register:'polite', note:'A negative question is the standard polite invitation.' },
  { id:'s:085', jp:'いいですね。', reading:'いいですね。', en:'That sounds good.', parts:['いい','ですね'], grammar:['g:iadj'], vocab:['v:ii'], register:'polite' },
  { id:'s:086', jp:'今日は暑いですね。', reading:'きょうはあついですね。', en:'It’s hot today, isn’t it.', parts:['今日は','暑い','ですね'], grammar:['g:iadj','g:desu'], vocab:['v:kyou','v:atsui'], register:'polite' },
  { id:'s:087', jp:'この靴は高くないです。', reading:'このくつはたかくないです。', en:'These shoes aren’t expensive.', parts:['この','靴は','高くない','です'], grammar:['g:iadj','g:desu'], vocab:['v:kutsu','v:takai'], register:'polite' },
  { id:'s:088', jp:'野菜をたくさん食べます。', reading:'やさいをたくさんたべます。', en:'I eat a lot of vegetables.', parts:['野菜を','たくさん','食べます'], grammar:['g:wo','g:masu'], vocab:['v:yasai','v:takusan','v:taberu'], register:'polite' },
  { id:'s:089', jp:'肉はあまり食べません。', reading:'にくはあまりたべません。', en:'I don’t eat much meat.', parts:['肉は','あまり','食べません'], grammar:['g:masen','g:desu'], vocab:['v:amari','v:niku','v:taberu'], register:'polite', note:'A speaker normally topicalises here — 肉は… — rather than starting with あまり.' },
  { id:'s:090', jp:'家では日本語で話します。', reading:'いえではにほんごではなします。', en:'At home we speak in Japanese.', parts:['家では','日本語で','話します'], grammar:['g:de','g:masu','g:desu'], vocab:['v:ie','v:hanasu'], register:'polite', note:'Two different で here: the first marks the place, the second marks the means.' },
  { id:'s:091', jp:'ここに名前を書きます。', reading:'ここになまえをかきます。', en:'I write my name here.', parts:['ここに','名前を','書きます'], grammar:['g:wo','g:masu','g:ni_he'], vocab:['v:namae','v:koko','v:kaku'], register:'polite' },
  { id:'s:092', jp:'ちょっと待ってください。', reading:'ちょっとまってください。', en:'Please wait a moment.', parts:['ちょっと','待ってください'], grammar:['g:tekudasai','g:te_u'], vocab:['v:chotto','v:matsu'], register:'polite' },
  { id:'s:093', jp:'もう一度お願いします。', reading:'もういちどおねがいします。', en:'Once more, please.', parts:['もう一度','お願いします'], grammar:['g:masu'], vocab:['v:onegaishimasu','v:ichi'], register:'polite' },
  { id:'s:094', jp:'この単語の意味が分かりません。', reading:'このたんごのいみがわかりません。', en:'I don’t understand the meaning of this word.', parts:['この','単語の','意味が','分かりません'], grammar:['g:no','g:masen'], vocab:['v:wakaru'], register:'polite' },
  { id:'s:095', jp:'図書館はどこにありますか。', reading:'としょかんはどこにありますか。', en:'Where is the library?', parts:['図書館は','どこに','ありますか'], grammar:['g:aruiru','g:ka','g:masu','g:desu','g:ni_he'], vocab:['v:toshokan','v:doko','v:aru'], register:'polite' },
  { id:'s:096', jp:'病院の前にあります。', reading:'びょういんのまえにあります。', en:'It’s in front of the hospital.', parts:['病院の','前に','あります'], grammar:['g:aruiru','g:no','g:masu','g:ni_he'], vocab:['v:byouin','v:aru'], register:'polite' },
  { id:'s:097', jp:'家に帰ります。', reading:'いえにかえります。', en:'I’m going home.', parts:['家に','帰ります'], grammar:['g:ni_he','g:masu'], vocab:['v:ie','v:kaeru'], register:'polite' },
  { id:'s:098', jp:'毎朝七時に起きます。', reading:'まいあさしちじにおきます。', en:'I get up at seven every morning.', parts:['毎朝','七時に','起きます'], grammar:['g:ni_he','g:masu','g:counters'], vocab:['v:asa','v:okiru'], register:'polite', note:'七時 is しちじ, never ななじ. Clock readings are fixed and do not follow the よん／なな preference.' },
  { id:'s:099', jp:'夜はテレビを見ません。', reading:'よるはテレビをみません。', en:'I don’t watch TV at night.', parts:['夜は','テレビを','見ません'], grammar:['g:masen','g:wo','g:desu'], vocab:['v:yoru','v:terebi','v:miru'], register:'polite' },
  { id:'s:100', jp:'その本を読みましたか。', reading:'そのほんをよみましたか。', en:'Did you read that book?', parts:['その','本を','読みましたか'], grammar:['g:mashita','g:ka','g:wo'], vocab:['v:hon','v:yomu'], register:'polite' },
  { id:'s:101', jp:'いいえ、読みませんでした。', reading:'いいえ、よみませんでした。', en:'No, I didn’t read it.', parts:['いいえ、','読みませんでした'], grammar:['g:mashita','g:masen'], vocab:['v:iie','v:yomu'], register:'polite' },
  { id:'s:102', jp:'スマホで音楽を聞きます。', reading:'スマホでおんがくをききます。', en:'I listen to music on my phone.', parts:['スマホで','音楽を','聞きます'], grammar:['g:de','g:wo','g:masu'], vocab:['v:sumaho','v:kiku'], register:'polite' },
  { id:'s:103', jp:'この店のパンはおいしいです。', reading:'このみせのパンはおいしいです。', en:'The bread at this shop is delicious.', parts:['この','店の','パンは','おいしい','です'], grammar:['g:no','g:iadj','g:desu'], vocab:['v:mise','v:pan','v:oishii'], register:'polite' },
  { id:'s:104', jp:'卵と野菜を買いました。', reading:'たまごとやさいをかいました。', en:'I bought eggs and vegetables.', parts:['卵と','野菜を','買いました'], grammar:['g:mashita','g:wo','g:to'], vocab:['v:tamago','v:yasai','v:kau'], register:'polite' },
  { id:'s:105', jp:'果物が好きです。', reading:'くだものがすきです。', en:'I like fruit.', parts:['果物が','好き','です'], grammar:['g:suki'], vocab:['v:kudamono','v:suki'], register:'polite' },
  { id:'s:106', jp:'土曜日は何をしますか。', reading:'どようびはなにをしますか。', en:'What are you doing on Saturday?', parts:['土曜日は','何を','しますか'], grammar:['g:ka','g:wo','g:masu','g:desu'], vocab:['v:doyoubi','v:nani','v:suru'], register:'polite' },
  { id:'s:107', jp:'友達とご飯を食べます。', reading:'ともだちとごはんをたべます。', en:'I’m eating with a friend.', parts:['友達と','ご飯を','食べます'], grammar:['g:wo','g:masu','g:to'], vocab:['v:tomodachi','v:gohan','v:taberu'], register:'polite' },
  { id:'s:108', jp:'この時計は便利です。', reading:'このとけいはべんりです。', en:'This watch is handy.', parts:['この','時計は','便利','です'], grammar:['g:naadj','g:kono','g:desu'], vocab:['v:tokei','v:benri'], register:'polite' },
  { id:'s:109', jp:'私の国は日本じゃないです。', reading:'わたしのくにはにほんじゃないです。', en:'My country isn’t Japan.', parts:['私の','国は','日本','じゃないです'], grammar:['g:janai','g:no','g:desu'], vocab:['v:kuni','v:nihon'], register:'polite' },
  { id:'s:110', jp:'日本語の勉強は楽しいです。', reading:'にほんごのべんきょうはたのしいです。', en:'Studying Japanese is fun.', parts:['日本語の','勉強は','楽しい','です'], grammar:['g:no','g:iadj','g:desu'], vocab:['v:nihongo','v:tanoshii'], register:'polite' },

  // ── て-form: requests ─────────────────────────────────────────────────────
  { id:'s:111', jp:'ちょっと待ってください。', reading:'ちょっとまってください。', en:'Please wait a moment.', parts:['ちょっと','待って','ください'], grammar:['g:tekudasai','g:te_u'], vocab:['v:chotto','v:matsu'], register:'polite' },
  { id:'s:112', jp:'ここに名前を書いてください。', reading:'ここになまえをかいてください。', en:'Please write your name here.', parts:['ここに','名前を','書いて','ください'], grammar:['g:tekudasai','g:wo','g:ni_he','g:te_u'], vocab:['v:koko','v:namae','v:kaku'], register:'polite' },
  { id:'s:113', jp:'ゆっくり話してください。', reading:'ゆっくりはなしてください。', en:'Please speak slowly.', parts:['ゆっくり','話して','ください'], grammar:['g:tekudasai','g:te_u','g:te'], vocab:['v:yukkuri','v:hanasu'], register:'polite', note:'Worth memorising before any trip — it works on anyone, anywhere.' },
  { id:'s:114', jp:'この漢字を読んでください。', reading:'このかんじをよんでください。', en:'Please read this kanji.', parts:['この','漢字を','読んで','ください'], grammar:['g:tekudasai','g:te_u','g:kono','g:wo','g:de'], vocab:['v:kanji','v:yomu'], register:'polite' },
  { id:'s:115', jp:'ここに座ってください。', reading:'ここにすわってください。', en:'Please sit here.', parts:['ここに','座って','ください'], grammar:['g:tekudasai','g:te_u','g:ni_he'], vocab:['v:koko','v:suwaru'], register:'polite' },
  { id:'s:116', jp:'写真を撮ってください。', reading:'しゃしんをとってください。', en:'Please take a photo.', parts:['写真を','撮って','ください'], grammar:['g:tekudasai','g:te_u','g:wo'], vocab:['v:shashin','v:toru'], register:'polite' },
  { id:'s:117', jp:'明日来てください。', reading:'あしたきてください。', en:'Please come tomorrow.', parts:['明日','来て','ください'], grammar:['g:tekudasai','g:te'], vocab:['v:ashita','v:kuru'], register:'polite', note:'来る is irregular: the て-form is 来て, read きて.' },

  // ── て-form: ています ──────────────────────────────────────────────────────
  { id:'s:118', jp:'今ご飯を食べています。', reading:'いまごはんをたべています。', en:'I’m eating a meal right now.', parts:['今','ご飯を','食べて','います'], grammar:['g:teimasu','g:wo','g:masu','g:te'], vocab:['v:ima','v:gohan','v:taberu'], register:'polite' },
  { id:'s:119', jp:'兄は日本に住んでいます。', reading:'あにはにほんにすんでいます。', en:'My older brother lives in Japan.', parts:['兄は','日本に','住んで','います'], grammar:['g:teimasu','g:masu','g:desu','g:ni_he','g:de','g:te_u'], vocab:['v:ani','v:nihon','v:sumu'], register:'polite', note:'住む is nearly always ています — living somewhere is a continuing state, not an action.' },
  { id:'s:120', jp:'友達を待っています。', reading:'ともだちをまっています。', en:'I’m waiting for a friend.', parts:['友達を','待って','います'], grammar:['g:teimasu','g:wo','g:masu','g:te_u'], vocab:['v:tomodachi','v:matsu'], register:'polite' },
  { id:'s:121', jp:'兄は会社で働いています。', reading:'あにはかいしゃではたらいています。', en:'My older brother works at a company.', parts:['兄は','会社で','働いて','います'], grammar:['g:teimasu','g:de','g:masu','g:desu','g:te'], vocab:['v:ani','v:kaisha','v:hataraku'], register:'polite', note:'A job is an ongoing state, so Japanese uses ています where English uses a plain present.' },
  { id:'s:122', jp:'何をしていますか。', reading:'なにをしていますか。', en:'What are you doing?', parts:['何を','して','いますか'], grammar:['g:teimasu','g:ka','g:masu','g:wo','g:te'], vocab:['v:nani','v:suru'], register:'polite' },
  { id:'s:123', jp:'音楽を聞いています。', reading:'おんがくをきいています。', en:'I’m listening to music.', parts:['音楽を','聞いて','います'], grammar:['g:teimasu','g:wo','g:masu','g:te_u'], vocab:['v:ongaku','v:kiku'], register:'polite' },
  { id:'s:124', jp:'猫が寝ています。', reading:'ねこがねています。', en:'The cat is sleeping.', parts:['猫が','寝て','います'], grammar:['g:teimasu','g:masu','g:te'], vocab:['v:neko','v:neru'], register:'polite' },

  // ── て-form: permission ───────────────────────────────────────────────────
  { id:'s:125', jp:'ここで写真を撮ってもいいですか。', reading:'ここでしゃしんをとってもいいですか。', en:'May I take a photo here?', parts:['ここで','写真を','撮っても','いいですか'], grammar:['g:temoii','g:de','g:wo','g:mo','g:te_u'], vocab:['v:koko','v:shashin','v:toru'], register:'polite' },
  { id:'s:126', jp:'入ってもいいですか。', reading:'はいってもいいですか。', en:'May I come in?', parts:['入っても','いいですか'], grammar:['g:temoii','g:mo','g:te_u'], vocab:['v:hairu'], register:'polite' },
  { id:'s:127', jp:'はい、どうぞ。', reading:'はい、どうぞ。', en:'Yes, go ahead.', parts:['はい、','どうぞ'], grammar:[], vocab:['v:hai','v:douzo'], register:'polite', note:'The natural answer when permission is granted. はい、いいです can read as a refusal instead.' },
  { id:'s:128', jp:'この本を読んでもいいですか。', reading:'このほんをよんでもいいですか。', en:'May I read this book?', parts:['この','本を','読んでも','いいですか'], grammar:['g:temoii','g:kono','g:wo','g:mo','g:te_u'], vocab:['v:hon','v:yomu'], register:'polite' },
  { id:'s:129', jp:'ここに座ってもいいですか。', reading:'ここにすわってもいいですか。', en:'May I sit here?', parts:['ここに','座っても','いいですか'], grammar:['g:temoii','g:ni_he','g:mo','g:te_u'], vocab:['v:koko','v:suwaru'], register:'polite' },
  { id:'s:130', jp:'電話を使ってもいいですか。', reading:'でんわをつかってもいいですか。', en:'May I use the phone?', parts:['電話を','使っても','いいですか'], grammar:['g:temoii','g:wo','g:mo','g:te_u'], vocab:['v:denwa','v:tsukau'], register:'polite' },

  // ── て-form: prohibition ──────────────────────────────────────────────────
  { id:'s:131', jp:'ここに入ってはいけません。', reading:'ここにはいってはいけません。', en:'You must not go in here.', parts:['ここに','入っては','いけません'], grammar:['g:tewaikemasen','g:masen','g:ni_he','g:desu','g:te_u'], vocab:['v:koko','v:hairu'], register:'polite' },
  { id:'s:132', jp:'図書館で話してはいけません。', reading:'としょかんではなしてはいけません。', en:'You must not talk in the library.', parts:['図書館で','話しては','いけません'], grammar:['g:tewaikemasen','g:de','g:masen','g:desu','g:te'], vocab:['v:toshokan','v:hanasu'], register:'polite' },
  { id:'s:133', jp:'ここで写真を撮ってはいけません。', reading:'ここでしゃしんをとってはいけません。', en:'You must not take photos here.', parts:['ここで','写真を','撮っては','いけません'], grammar:['g:tewaikemasen','g:de','g:masen','g:wo','g:desu','g:te_u'], vocab:['v:koko','v:shashin','v:toru'], register:'polite' },
  { id:'s:134', jp:'お酒を飲んではいけません。', reading:'おさけをのんではいけません。', en:'You must not drink alcohol.', parts:['お酒を','飲んでは','いけません'], grammar:['g:tewaikemasen','g:wo','g:masen','g:desu','g:te_u'], vocab:['v:sake','v:nomu'], register:'polite' },
  { id:'s:135', jp:'ここで遊んではいけません。', reading:'ここであそんではいけません。', en:'You must not play here.', parts:['ここで','遊んでは','いけません'], grammar:['g:tewaikemasen','g:de','g:masen','g:desu','g:te_u'], vocab:['v:koko','v:asobu'], register:'polite' },

  // ── て-form: connecting actions ───────────────────────────────────────────
  { id:'s:136', jp:'朝起きて、朝ご飯を食べます。', reading:'あさおきて、あさごはんをたべます。', en:'I get up in the morning and eat breakfast.', parts:['朝','起きて、','朝ご飯を','食べます'], grammar:['g:teconnect','g:te','g:masu','g:wo'], vocab:['v:asa','v:okiru','v:asagohan','v:taberu'], register:'polite' },
  { id:'s:137', jp:'家に帰って、勉強します。', reading:'いえにかえって、べんきょうします。', en:'I go home and study.', parts:['家に','帰って、','勉強します'], grammar:['g:teconnect','g:te','g:masu','g:ni_he','g:te_u'], vocab:['v:ie','v:kaeru','v:benkyou'], register:'polite' },
  { id:'s:138', jp:'駅に行って、友達に会います。', reading:'えきにいって、ともだちにあいます。', en:'I go to the station and meet a friend.', parts:['駅に','行って、','友達に','会います'], grammar:['g:teconnect','g:te','g:masu','g:ni_he','g:te_u'], vocab:['v:eki','v:iku','v:tomodachi','v:au'], register:'polite', note:'行く is the one common く-verb whose て-form is 行って, not 行いて.' },

      { type: 'text', body: 'Two tiny marks in the top right corner change a kana\'s consonant. **Dakuten** (a double quote) voices it: か→が, さ→ざ, た→だ. **Handakuten** (a small circle) turns は into ぱ.' },

      { type: 'text', body: 'From here the app fades romaji out **per kana**: once a kana has survived a few spaced reviews, its romaji stops appearing. Get everything below solid and the romaji will be gone within a week or two. (Settings can force it always on or always off if you would rather decide yourself.)' },

      { type: 'text', body: 'Everything you have learned so far uses ます. This lesson opens a different door. The **て-form** is not a tense and means nothing on its own — it is a connector, and half a dozen of the most useful structures in Japanese are waiting on the other side of it: requests, permission, prohibition, actions in progress, and joining sentences together.' },

      { type: 'text', body: '**る-verbs** are trivial — drop る, add て. **する** and **来る** make up the whole of Group 3, the only irregular verb group, so there is nothing to work out: you learn the two of them and you are done. (A few other verbs are irregular in one form each — ある has the negative ない, and 行く has a て-form you will meet next lesson — but they are not a group.)' },

      { type: 'text', body: 'Now put it to work. Add ください and you have a polite request — probably the single most useful thing you can say to a stranger.' },

__def("engine/exercises.js", function(__req, __exports){
// Exercise generation. Every exercise is a plain object; the UI renders it by `kind`,
// so adding a new exercise type means adding a generator here and a branch in the renderer.
//
// Each exercise reports which concept it tested, so any exercise anywhere in the app
// (lesson, review or practice) feeds the same SRS evidence.

const {KANA, KANA_BY_ID} = __req("content/kana.js");
const {VOCABULARY, VOCAB_BY_ID} = __req("content/vocabulary.js");
const {KANJI, KANJI_BY_ID} = __req("content/kanji.js");
const {GRAMMAR_BY_ID} = __req("content/grammar.js");
const {COUNTERS, COUNTERS_BY_ID} = __req("content/counters.js");
const {SENTENCES, SENTENCES_BY_ID} = __req("content/sentences.js");
const {toRomaji, romajiMatches} = __req("engine/romaji.js");
const {isIntroduced} = __req("engine/srs.js");
const {teForm, teDistractors, naiForm, naiDistractors, masuFromPlain} = __req("engine/conjugation.js");

const EXERCISE_LABELS = {
  'kana-recognition': 'Kana → sound',
  'kana-recall': 'Sound → kana',
  'kana-type': 'Type the reading',
  'vocab-jp-en': 'Word → meaning',
  'vocab-en-jp': 'Meaning → word',
  'vocab-reading': 'Word → reading',
  'kanji-meaning': 'Kanji → meaning',
  'kanji-reading': 'Kanji → reading',
  'particle': 'Fill in the particle',
  'cloze': 'Fill in the blank',
  'sentence-build': 'Build the sentence',
  'translate': 'Sentence → meaning',
  'matching': 'Match the pairs',
  'conjugation': 'Make the て-form',
  'counter': 'Read the count',
  'plain': 'ます → plain',
  'nai': 'Make the ない-form',
  'listening': 'Listen and choose',
};

const PARTICLES = ['は', 'が', 'を', 'に', 'で', 'へ', 'と', 'も', 'の', 'か'];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const sample = (arr, n) => shuffle(arr).slice(0, n);

/**
 * A sentence may only be served as an exercise once every grammar point and word in it has
 * been taught. Sentence tags are kept complete by tools/tag-sentences.js, so this single
 * check covers particles, conjugated forms and counters as well as vocabulary — a learner is
 * never asked to parse or produce something the curriculum has not reached.
 */
function sentenceReady(s) {
  const known = id => isIntroduced(id) || !!CONTEXT?.has(id);
  return (s.grammar || []).every(known) && (s.vocab || []).every(known);
}

/** Sentences usable right now for a given grammar point, with a graceful fallback. */
function readySentences(conceptId) {
  const tagged = SENTENCES.filter(s => s.grammar.includes(conceptId));
  const ready = tagged.filter(sentenceReady);
  // Before anything is introduced (a cold session, or the very first lesson) fall back to the
  // simplest tagged sentences rather than returning nothing at all.
  if (ready.length) return ready;
  return tagged.slice().sort((a, b) => a.grammar.length - b.grammar.length).slice(0, 3);
}

/**
 * Narrow a candidate pool to material the learner has actually been introduced to.
 * Offering だ and ふ as decoys in the very first lesson makes the answer guessable and
 * teaches nothing; falling back to the full set only when there isn't enough material yet.
 */
let CONTEXT = null;   // ids the current session should treat as familiar (e.g. this lesson's own concepts)

function familiar(items, idOf, minimum = 4) {
  const seen = items.filter(x => {
    const id = idOf(x);
    return isIntroduced(id) || CONTEXT?.has(id);
  });
  return seen.length >= minimum ? seen : items;
}

/** Build distractors, preferring genuinely confusable options over random ones. */
function distractors(correct, pool, n, preferred = []) {
  const out = [];
  for (const p of shuffle(preferred)) {
    if (p !== undefined && p !== null && p !== correct && !out.includes(p)) out.push(p);
    if (out.length >= n) break;
  }
  for (const p of shuffle(pool)) {
    if (out.length >= n) break;
    if (p !== correct && !out.includes(p)) out.push(p);
  }
  return out.slice(0, n);
