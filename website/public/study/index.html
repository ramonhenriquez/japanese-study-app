// ── individual generators ────────────────────────────────────────────────────

function kanaRecognition(k) {
  const pool = familiar(KANA.filter(x => x.script === k.script), x => x.id).map(x => x.romaji);
  const confuse = k.confusables.map(id => KANA_BY_ID[id]?.romaji).filter(Boolean);
  const choices = shuffle([k.romaji, ...distractors(k.romaji, pool, 3, confuse)]);
  return {
    kind: 'kana-recognition', conceptId: k.id, conceptType: 'kana',
    prompt: { glyph: k.kana, label: 'What sound is this?' },
    choices, answer: k.romaji,
    explain: k.note || null,
  };
}

function kanaRecall(k) {
  const pool = familiar(KANA.filter(x => x.script === k.script), x => x.id).map(x => x.kana);
  const confuse = k.confusables.map(id => KANA_BY_ID[id]?.kana).filter(Boolean);
  const choices = shuffle([k.kana, ...distractors(k.kana, pool, 3, confuse)]);
  return {
    kind: 'kana-recall', conceptId: k.id, conceptType: 'kana',
    prompt: { text: k.romaji, label: `Which ${k.script} is this?` },
    choices, answer: k.kana, choiceStyle: 'glyph',
    explain: k.note || null,
  };
}

function kanaType(k) {
  return {
    kind: 'kana-type', conceptId: k.id, conceptType: 'kana',
    prompt: { glyph: k.kana, label: 'Type the reading in romaji' },
    input: 'romaji', answer: k.romaji,
    check: v => romajiMatches(v, k.romaji),
    explain: k.note || null,
  };
}

/** Has the learner been taught the て-form rule that governs this verb's group? */
function teRuleKnown(v) {
  const point = v.group === 'godan' ? 'g:te_u' : 'g:te';
  return isIntroduced(point) || !!CONTEXT?.has(point);
}

function conjugationPlain(v) {
  const answer = v.word;
  const stem = v.masu.replace(/ます$/, '');
  // plausible wrong dictionary forms built from the same ます-stem
  const wrong = ['る', 'う', 'く', 'む', 'す', 'つ'].map(e => stem + e).filter(x => x !== answer);
  const choices = shuffle([answer, ...distractors(answer, wrong, 3)]);
  return {
    kind: 'plain', conceptId: 'g:plain', conceptType: 'grammar',
    prompt: { glyph: v.masu, sub: v.meanings[0], label: 'What is the plain (dictionary) form?' },
    choices, answer, choiceStyle: 'jp',
    explain: `${v.masu} → ${answer} · ${v.group === 'ichidan' ? 'る-verb: ます → る' : v.group === 'godan' ? 'う-verb: the い-row shifts back to the う-row' : 'irregular'}`,
  };
}

function conjugationNai(v) {
  const answer = naiForm(v);
  if (!answer) return null;
  const choices = shuffle([answer, ...distractors(answer, naiDistractors(v), 3)]);
  return {
    kind: 'nai', conceptId: 'g:nai', conceptType: 'grammar',
    prompt: { glyph: v.word, sub: v.reading, label: 'What is the ない-form?' },
    choices, answer, choiceStyle: 'jp',
    explain: `${v.word} (${v.meanings[0]}) → ${answer}`,
  };
}

function counterReading(c) {
  // Weight the irregular forms — those are the ones that cannot be worked out.
  const irregulars = c.forms.filter(f => f.irregular);
  const f = irregulars.length && Math.random() < 0.7 ? pick(irregulars) : pick(c.forms);
  const others = c.forms.filter(x => x.reading !== f.reading).map(x => x.reading);
  const choices = shuffle([f.reading, ...distractors(f.reading, others, 3)]);
  return {
    kind: 'counter', conceptId: c.id, conceptType: 'counter',
    prompt: { glyph: f.form, label: `How is this read? (counting ${c.counts})` },
    choices, answer: f.reading, choiceStyle: 'jp',
    explain: f.irregular ? `Irregular — ${f.form} is ${f.reading}, not the pattern you would expect.` : `${c.counter} counts ${c.counts}.`,
  };
}

function counterChoice(c) {
  // Which counter does this thing take?
  const others = COUNTERS.filter(x => x.id !== c.id).map(x => x.counter);
  const choices = shuffle([c.counter, ...distractors(c.counter, others, 3)]);
  return {
    kind: 'counter', conceptId: c.id, conceptType: 'counter',
    prompt: { text: `Counting ${c.counts}`, label: 'Which counter?' },
    choices, answer: c.counter, choiceStyle: 'jp',
    explain: c.note,
  };
}

function conjugationTe(v, conceptId) {
  const answer = teForm(v);
  if (!answer) return null;
  const choices = shuffle([answer, ...distractors(answer, teDistractors(v), 3)]);
  const groupLabel = v.group === 'ichidan' ? 'る-verb' : v.group === 'godan' ? 'う-verb' : 'irregular';
  return {
    kind: 'conjugation', conceptId: conceptId || (v.group === 'godan' ? 'g:te_u' : 'g:te'), conceptType: 'grammar',
    prompt: { glyph: v.word, sub: v.reading, label: `What is the て-form? (${groupLabel})` },
    choices, answer, choiceStyle: 'jp',
    explain: `${v.word} (${v.meanings[0]}) → ${answer}`,
  };
}

function vocabJpEn(v) {
  const known = familiar(VOCABULARY, x => x.id);
  const pool = known.filter(x => x.pos === v.pos).map(x => x.meanings[0]);
  const wide = known.map(x => x.meanings[0]);
  const choices = shuffle([v.meanings[0], ...distractors(v.meanings[0], wide, 3, pool)]);
  return {
    kind: 'vocab-jp-en', conceptId: v.id, conceptType: 'vocab',
    prompt: { glyph: v.word, sub: v.reading !== v.word ? v.reading : null, label: 'What does this mean?' },
    choices, answer: v.meanings[0],
    explain: v.note || null,
  };
}

function vocabEnJp(v) {
  const known = familiar(VOCABULARY, x => x.id);
  const pool = known.filter(x => x.pos === v.pos).map(x => x.word);
  const wide = known.map(x => x.word);
  const choices = shuffle([v.word, ...distractors(v.word, wide, 3, pool)]);
  return {
    kind: 'vocab-en-jp', conceptId: v.id, conceptType: 'vocab',
    prompt: { text: v.meanings.join(', '), label: 'Which word is this?' },
    choices, answer: v.word, choiceStyle: 'jp',
    explain: v.note || null,
  };
}

function vocabReading(v) {
  const known = familiar(VOCABULARY, x => x.id);
  const pool = known.filter(x => x.reading.length === v.reading.length).map(x => x.reading);
  const wide = known.map(x => x.reading);
  const choices = shuffle([v.reading, ...distractors(v.reading, wide, 3, pool)]);
  return {
    kind: 'vocab-reading', conceptId: v.id, conceptType: 'vocab',
    prompt: { glyph: v.word, label: 'How is this read?' },
    choices, answer: v.reading, choiceStyle: 'jp',
    explain: `${v.meanings[0]} · ${toRomaji(v.reading)}`,
  };
}

function kanjiMeaning(k) {
  const wide = familiar(KANJI, x => x.id, 4).map(x => x.meanings[0]);
  const choices = shuffle([k.meanings[0], ...distractors(k.meanings[0], wide, 3)]);
  return {
    kind: 'kanji-meaning', conceptId: k.id, conceptType: 'kanji',
    prompt: { glyph: k.char, label: 'What does this kanji mean?' },
    choices, answer: k.meanings[0],
    explain: k.note || null,
  };
}

function kanjiReading(k) {
  // Ask through a word that uses it wherever one exists — vocabulary-first, as the curriculum says.
  const word = (k.vocab || []).map(id => VOCAB_BY_ID[id]).filter(Boolean)[0];
  if (word) {
    const wide = familiar(VOCABULARY, x => x.id).map(x => x.reading);
    const choices = shuffle([word.reading, ...distractors(word.reading, wide, 3)]);
    return {
      kind: 'kanji-reading', conceptId: k.id, conceptType: 'kanji',
      prompt: { glyph: word.word, label: `How is this read? (${k.char} = ${k.meanings[0]})` },
      choices, answer: word.reading, choiceStyle: 'jp',
      explain: `${word.meanings[0]} · ${toRomaji(word.reading)}`,
    };
  }
  const all = KANJI.flatMap(x => [...x.on, ...x.kun]);
  const answer = k.kun[0] || k.on[0];
  const choices = shuffle([answer, ...distractors(answer, all, 3)]);
  return {
    kind: 'kanji-reading', conceptId: k.id, conceptType: 'kanji',
    prompt: { glyph: k.char, label: 'Which reading belongs to this kanji?' },
    choices, answer, choiceStyle: 'jp',
    explain: k.meanings.join(', '),
  };
}

function particleExercise(s) {
  // Particles are found through the sentence's own chunk boundaries, never by scanning
  // raw text. Scanning finds the で inside です and the と inside ちょっと; chunk-final
  // characters do not. A chunk qualifies only when what remains after removing the
  // particle is itself a word we know — a vocabulary entry, or something with a kanji in it.
  const BLANKABLE = ['は', 'が', 'を', 'に', 'で', 'へ', 'と', 'も', 'の', 'か'];
  const stripped = p => p.replace(/[、。]/g, '');

  const candidates = [];
  let cursor = 0;
  for (const raw of s.parts) {
    const part = stripped(raw);
    const particle = part.slice(-1);
    const stem = part.slice(0, -1);
    const isWord = stem.length > 0 && (
      /[一-龯]/.test(stem) ||
      VOCABULARY.some(v => v.word === stem || v.reading === stem)
    );
    if (BLANKABLE.includes(particle) && isWord) {
      candidates.push({ p: particle, i: cursor + raw.indexOf(part) + part.length - 1 });
    }
    cursor += raw.length;
  }
  if (!candidates.length) return null;

  const chosen = pick(candidates);
  const before = s.jp.slice(0, chosen.i);
  const after = s.jp.slice(chosen.i + 1);
  const gid = s.grammar[0];

  // は and も are interchangeable in far too many of these frames to use as decoys
  // for one another — a learner would be marked wrong for a correct answer.
  const ambiguous = { 'は': 'も', 'も': 'は' };
  const pool = BLANKABLE.filter(x => x !== 'か' && x !== ambiguous[chosen.p]);
  const choices = shuffle([chosen.p, ...distractors(chosen.p, pool, 3)]);

  return {
    kind: 'particle', conceptId: gid || s.id, conceptType: gid ? 'grammar' : 'sentence',
    prompt: { before, after, label: 'Which particle goes in the gap?', sub: s.en },
    choices, answer: chosen.p, choiceStyle: 'jp',
    explain: gid ? GRAMMAR_BY_ID[gid]?.gloss : null,
    sentenceId: s.id,
  };
}

function sentenceBuild(s) {
  const scrambled = shuffle(s.parts);
  return {
    kind: 'sentence-build', conceptId: s.grammar[0] || s.id, conceptType: s.grammar[0] ? 'grammar' : 'sentence',
    prompt: { text: s.en, label: 'Build this sentence' },
    parts: scrambled, answer: s.parts.join(''), tail: /[。？]$/.test(s.jp) ? s.jp.slice(-1) : '',
    explain: `${s.jp} · ${s.reading}`,
    sentenceId: s.id,
  };
}

function translate(s) {
  // Prefer sentences whose grammar the learner has met, but never let the pool shrink below
  // what a four-way choice needs — otherwise the question degenerates into a single option.
  const seen = SENTENCES.filter(sentenceReady);
  const wide = (seen.length >= 6 ? seen : SENTENCES).map(x => x.en);
  const choices = shuffle([s.en, ...distractors(s.en, wide, 3)]);
  return {
    kind: 'translate', conceptId: s.grammar[0] || s.id, conceptType: s.grammar[0] ? 'grammar' : 'sentence',
    prompt: { glyph: s.jp, sub: s.reading, glyphSize: 'sentence', label: 'What does this mean?' },
    choices, answer: s.en,
    sentenceId: s.id,
  };
}

function listening(s) {
  const wide = SENTENCES.map(x => x.jp);
  const choices = shuffle([s.jp, ...distractors(s.jp, wide, 3)]);
  return {
    kind: 'listening', conceptId: s.grammar[0] || s.id, conceptType: s.grammar[0] ? 'grammar' : 'sentence',
    prompt: { speak: s.jp, label: 'Listen, then choose what you heard' },
    choices, answer: s.jp, choiceStyle: 'jp',
    explain: `${s.reading} — ${s.en}`,
    sentenceId: s.id,
  };
}

function matching(items) {
  const pairs = items.map(it => {
    if (it.kind === 'kana') return { left: it.data.kana, right: it.data.romaji, conceptId: it.data.id };
    if (it.kind === 'kanji') return { left: it.data.char, right: it.data.meanings[0], conceptId: it.data.id };
    return { left: it.data.word, right: it.data.meanings[0], conceptId: it.data.id };
  });
  return {
    kind: 'matching', conceptId: null, conceptIds: pairs.map(p => p.conceptId), conceptType: items[0].kind,
    prompt: { label: 'Match each pair' },
    pairs, rights: shuffle(pairs.map(p => p.right)),
  };
}

// ── public API ───────────────────────────────────────────────────────────────

const KANA_KINDS = [kanaRecognition, kanaRecall, kanaType];

/** Build an exercise for one concept id. `variety` picks a different angle each time. */
function exerciseFor(conceptId, { allowTyping = true, allowAudio = false } = {}) {
  if (conceptId.startsWith('kana:')) {
    const k = KANA_BY_ID[conceptId];
    if (!k) return null;
    const kinds = allowTyping ? KANA_KINDS : KANA_KINDS.slice(0, 2);
    return pick(kinds)(k);
  }
  if (conceptId.startsWith('v:')) {
    const v = VOCAB_BY_ID[conceptId];
    if (!v) return null;
    const opts = [vocabJpEn, vocabEnJp];
    if (v.word !== v.reading) opts.push(vocabReading);
    // A verb may be asked as a conjugation question only once the rule for *its group*
    // has been taught — る-verbs and irregulars in one lesson, う-verbs in the next.
    if (v.te && teRuleKnown(v)) opts.push(conjugationTe);
    return pick(opts)(v);
  }
  if (conceptId.startsWith('k:')) {
    const k = KANJI_BY_ID[conceptId];
    if (!k) return null;
    return pick([kanjiMeaning, kanjiReading])(k);
  }
  if (conceptId.startsWith('c:')) {
    const c = COUNTERS_BY_ID[conceptId];
    if (!c) return null;
    return pick([counterReading, counterReading, counterChoice])(c);
  }
  if (conceptId === 'g:counters') {
    const known = familiar(COUNTERS, c => c.id, 1);
    return counterReading(pick(known));
  }
  if (conceptId === 'g:plain' || conceptId === 'g:nai') {
    const pool = familiar(VOCABULARY.filter(v => v.te && v.masu), v => v.id, 3);
    if (pool.length) {
      const ex = (conceptId === 'g:plain' ? conjugationPlain : conjugationNai)(pick(pool));
      if (ex) return ex;
    }
  }
  if (conceptId === 'g:te' || conceptId === 'g:te_u') {
    const wanted = conceptId === 'g:te_u' ? 'godan' : null;
    const pool = VOCABULARY.filter(v => v.te && (wanted ? v.group === 'godan' : v.group !== 'godan'));
    const verbs = familiar(pool, v => v.id, 3);
    if (verbs.length) {
      const ex = conjugationTe(pick(verbs), conceptId);
      if (ex) return ex;
    }
  }
  if (conceptId.startsWith('g:')) {
    const g = GRAMMAR_BY_ID[conceptId];
    if (!g) return null;
    const pool = readySentences(conceptId);
    if (!pool.length) return null;
    const s = pick(pool);
    const builders = [sentenceBuild, translate];
    const p = particleExercise(s);
    if (p) builders.push(() => p);
    if (allowAudio) builders.push(listening);
    return pick(builders)(s);
  }
  return null;
}

/** A mixed set of exercises over a list of concepts, deduplicated and shuffled. */
function buildSession(conceptIds, { limit = 12, allowTyping = true, allowAudio = false, context = conceptIds } = {}) {
  const previous = CONTEXT;
  CONTEXT = new Set(context || []);
  try {
    const out = [];
    for (const id of shuffle([...new Set(conceptIds)])) {
      if (out.length >= limit) break;
      const ex = exerciseFor(id, { allowTyping, allowAudio });
      if (ex) out.push(ex);
    }
    return out;
  } finally {
    CONTEXT = previous;
  }
}

/** Practice-mode pools. Each returns concept ids the mode can draw on. */
function practicePool(mode, { isIntroduced }) {
  const seen = id => isIntroduced(id);
  switch (mode) {
    case 'kana-hiragana': return KANA.filter(k => k.script === 'hiragana' && seen(k.id)).map(k => k.id);
    case 'kana-katakana': return KANA.filter(k => k.script === 'katakana' && seen(k.id)).map(k => k.id);
    case 'vocabulary':    return VOCABULARY.filter(v => seen(v.id)).map(v => v.id);
    case 'kanji':         return KANJI.filter(k => seen(k.id)).map(k => k.id);
    case 'grammar':       return Object.keys(GRAMMAR_BY_ID).filter(seen);
    default:              return [];
  }
}

function makeMatching(conceptIds, size = 4) {
  const items = sample(conceptIds, size).map(id => {
    if (id.startsWith('kana:')) return { kind: 'kana', data: KANA_BY_ID[id] };
    if (id.startsWith('k:')) return { kind: 'kanji', data: KANJI_BY_ID[id] };
    return { kind: 'vocab', data: VOCAB_BY_ID[id] };
  }).filter(x => x.data);
  return items.length >= 3 ? matching(items) : null;
}

function particleDrill(introducedGrammar) {
  const pool = SENTENCES.filter(sentenceReady);
  const src = pool.length ? pool : SENTENCES;
  for (const s of shuffle(src)) {
    const ex = particleExercise(s);
    if (ex) return ex;
  }
  return null;
}

// Kana → Hepburn romaji. Single source of truth so no romaji is ever stored by hand.

const BASE = {
  あ:'a',い:'i',う:'u',え:'e',お:'o', か:'ka',き:'ki',く:'ku',け:'ke',こ:'ko',
  さ:'sa',し:'shi',す:'su',せ:'se',そ:'so', た:'ta',ち:'chi',つ:'tsu',て:'te',と:'to',
  な:'na',に:'ni',ぬ:'nu',ね:'ne',の:'no', は:'ha',ひ:'hi',ふ:'fu',へ:'he',ほ:'ho',
  ま:'ma',み:'mi',む:'mu',め:'me',も:'mo', や:'ya',ゆ:'yu',よ:'yo',
  ら:'ra',り:'ri',る:'ru',れ:'re',ろ:'ro', わ:'wa',ゐ:'i',ゑ:'e',を:'wo',ん:'n',
  が:'ga',ぎ:'gi',ぐ:'gu',げ:'ge',ご:'go', ざ:'za',じ:'ji',ず:'zu',ぜ:'ze',ぞ:'zo',
  だ:'da',ぢ:'ji',づ:'zu',で:'de',ど:'do', ば:'ba',び:'bi',ぶ:'bu',べ:'be',ぼ:'bo',
  ぱ:'pa',ぴ:'pi',ぷ:'pu',ぺ:'pe',ぽ:'po',
  ぁ:'a',ぃ:'i',ぅ:'u',ぇ:'e',ぉ:'o',
};
const YOON = {
  き:'ky',し:'sh',ち:'ch',に:'ny',ひ:'hy',み:'my',り:'ry',
  ぎ:'gy',じ:'j',ぢ:'j',び:'by',ぴ:'py',
};
const SMALL_VOWEL = { ゃ:'a', ゅ:'u', ょ:'o' };
const VOWELS = 'aiueo';

const toHira = s => [...s].map(c => {
  const cp = c.codePointAt(0);
  return (cp >= 0x30a1 && cp <= 0x30f6) ? String.fromCodePoint(cp - 0x60) : c;
}).join('');

/** Convert a kana string to Hepburn romaji. Non-kana characters pass through. */
function toRomaji(input) {
  if (!input) return '';
  const src = toHira(input);
  let out = '';
  for (let i = 0; i < src.length; i++) {
    const ch = src[i];
    const next = src[i + 1];

    // Small っ doubles the following consonant
    if (ch === 'っ') {
      const after = romajiOf(src, i + 1);
      out += after ? after[0] : 't';
      continue;
    }
    // Prolonged sound mark repeats the previous vowel
    if (ch === 'ー') {
      const last = out[out.length - 1];
      if (VOWELS.includes(last)) out += last;
      continue;
    }
    // Yōon: consonant + small ya/yu/yo
    if (YOON[ch] && SMALL_VOWEL[next]) {
      out += YOON[ch] + SMALL_VOWEL[next];
      i++;
      continue;
    }
    // ん becomes m before b/m/p, and takes an apostrophe before a vowel or y
    if (ch === 'ん') {
      const nr = romajiOf(src, i + 1);
      if (nr && 'bmp'.includes(nr[0])) out += 'm';
      else if (nr && (VOWELS.includes(nr[0]) || nr[0] === 'y')) out += "n'";
      else out += 'n';
      continue;
    }
    out += BASE[ch] ?? ch;
  }
  return out;
}

function romajiOf(src, i) {
  const ch = src[i];
  if (!ch) return '';
  if (YOON[ch] && SMALL_VOWEL[src[i + 1]]) return YOON[ch] + SMALL_VOWEL[src[i + 1]];
  return BASE[ch] ?? '';
}

/** Loose comparison for typed answers: ignores case, spaces, apostrophes and common variants. */
function romajiMatches(typed, expected) {
  const norm = s => (s || '').toLowerCase().trim()
    .replace(/[\s'’\-]/g, '')
    .replace(/shi/g, 'si').replace(/chi/g, 'ti').replace(/tsu/g, 'tu')
    .replace(/fu/g, 'hu').replace(/ji/g, 'zi')
    .replace(/sha/g, 'sya').replace(/shu/g, 'syu').replace(/sho/g, 'syo')
    .replace(/cha/g, 'tya').replace(/chu/g, 'tyu').replace(/cho/g, 'tyo')
    .replace(/ja/g, 'zya').replace(/ju/g, 'zyu').replace(/jo/g, 'zyo')
    .replace(/wo/g, 'o').replace(/mm/g, 'nm').replace(/mb/g, 'nb').replace(/mp/g, 'np');
  return norm(typed) === norm(expected);
}

__exports.__set({toRomaji, romajiMatches});
});

__def("engine/conjugation.js", function(__req, __exports){
// て-form construction, as a rule rather than a stored string. The vocabulary file stores
// each verb's て-form so it can be displayed, and tools/verify-content.js re-derives every
// one of them from here — so a typo in the data fails the build rather than teaching a
// learner a form that does not exist.

const TE_ENDINGS = [
  { match: ['う', 'つ', 'る'], ending: 'って' },
  { match: ['む', 'ぶ', 'ぬ'], ending: 'んで' },
  { match: ['く'],             ending: 'いて' },
  { match: ['ぐ'],             ending: 'いで' },
  { match: ['す'],             ending: 'して' },
];

// 行く is the only common く-verb that does not follow the く → いて rule.
const IRREGULAR_TE = { '行く': '行って', '来る': '来て' };

/** The て-form of a verb entry ({ word, reading, group }). Returns null if it cannot be derived. */
function teForm(v) {
  if (!v || !v.group) return null;
  if (IRREGULAR_TE[v.word]) return IRREGULAR_TE[v.word];

  if (v.group === 'irregular') {
    if (v.word.endsWith('する')) return v.word.slice(0, -2) + 'して';
    return null;
  }
  if (v.group === 'ichidan') return v.word.slice(0, -1) + 'て';

  const last = v.reading.slice(-1);
  const rule = TE_ENDINGS.find(r => r.match.includes(last));
  return rule ? v.word.slice(0, -1) + rule.ending : null;
}

/** Plausible wrong forms of the same verb — far better distractors than other verbs' forms. */
function teDistractors(v) {
  const correct = teForm(v);
  if (!correct) return [];
  const stem = v.word.endsWith('する') ? v.word.slice(0, -2) : v.word.slice(0, -1);
  const all = ['って', 'んで', 'いて', 'いで', 'して', 'て'].map(e => stem + e);
  return [...new Set(all)].filter(x => x !== correct);
}

// ── plain (dictionary) form ↔ ます-form ──────────────────────────────────────
// The dictionary form is what `word` already holds, so the interesting direction is the
// mapping itself: which ます-form corresponds to which plain form, and why.

const U_ROW = { 'う':'い','つ':'ち','る':'り','む':'み','ぶ':'び','ぬ':'に','く':'き','ぐ':'ぎ','す':'し' };
const A_ROW = { 'う':'わ','つ':'た','る':'ら','む':'ま','ぶ':'ば','ぬ':'な','く':'か','ぐ':'が','す':'さ' };

/** The plain non-past (dictionary) form. For verbs this is simply the stored word. */
function plainForm(v) {
  return v?.word ?? null;
}

const IRREGULAR_NAI = { 'する': 'しない', '来る': '来ない', 'ある': 'ない' };

/**
 * The plain negative (ない-form).
 * る-verbs drop る. う-verbs shift the final kana to the あ-row — except う, which becomes わ,
 * a fossil of an older わ that survives only here. ある is suppletive: its negative is ない.
 */
function naiForm(v) {
  if (!v || !v.group) return null;
  if (IRREGULAR_NAI[v.word]) return IRREGULAR_NAI[v.word];
  if (v.group === 'irregular') {
    if (v.word.endsWith('する')) return v.word.slice(0, -2) + 'しない';
    return null;
  }
  if (v.group === 'ichidan') return v.word.slice(0, -1) + 'ない';
  const last = v.reading.slice(-1);
  const shifted = A_ROW[last];
  return shifted ? v.word.slice(0, -1) + shifted + 'ない' : null;
}

/** Plausible wrong ない-forms of the same verb, for multiple-choice distractors. */
function naiDistractors(v) {
  const correct = naiForm(v);
  if (!correct) return [];
  const stem = v.word.endsWith('する') ? v.word.slice(0, -2) : v.word.slice(0, -1);
  const all = [...new Set(Object.values(A_ROW))].map(k => stem + k + 'ない').concat(stem + 'ない');
  return [...new Set(all)].filter(x => x !== correct);
}

/** Sanity: the ます-form should be derivable from the plain form the same way. */
function masuFromPlain(v) {
  if (!v || !v.group) return null;
  if (v.word === '来る') return '来ます';
  if (v.group === 'irregular') return v.word.endsWith('する') ? v.word.slice(0, -2) + 'します' : null;
  if (v.group === 'ichidan') return v.word.slice(0, -1) + 'ます';
  const last = v.reading.slice(-1);
  const shifted = U_ROW[last];
  return shifted ? v.word.slice(0, -1) + shifted + 'ます' : null;
}

__exports.__set({TE_ENDINGS, teForm, teDistractors, plainForm, naiForm, naiDistractors, masuFromPlain});
});

__def("ui/exercise.js", function(__req, __exports){
// The exercise runner. Every studying surface in the app — lessons, review and practice —
// hands a list of exercises to this one component, so evidence is recorded identically
// wherever the answer was given.

const {el, clear, icon, speak, audioAvailable} = __req("ui/dom.js");
const {grade} = __req("engine/srs.js");
const {EXERCISE_LABELS, shuffle} = __req("engine/exercises.js");
const {toRomaji} = __req("engine/romaji.js");

function runExercises(container, exercises, { title = 'Practice', note = null, onDone, showProgress = true }) {
  let index = 0;
  const results = [];
  let answered = false;
  let usedHint = false;

  const bar = el('div', { class: 'ex-bar' });
  const label = el('p', { class: 'ex-count' });
  const stage = el('div', { class: 'ex-stage' });
  const feedback = el('div', { class: 'ex-feedback', 'aria-live': 'polite' });
  const footer = el('div', { class: 'ex-footer' });

  const root = el('section', { class: 'exercise' },
    showProgress ? el('div', { class: 'ex-head' }, el('h2', { class: 'ex-title' }, title), label) : null,
    showProgress ? bar : null,
    note ? el('p', { class: 'ex-note' }, note) : null,
    stage, feedback, footer,
  );
  clear(container).append(root);
  render();

  function render() {
    answered = false;
    usedHint = false;
    clear(stage); clear(feedback); clear(footer);
    feedback.className = 'ex-feedback';

    if (index >= exercises.length) return finish();

    const ex = exercises[index];
    label.textContent = `${index + 1} / ${exercises.length} · ${EXERCISE_LABELS[ex.kind] || ex.kind}`;
    clear(bar).append(...exercises.map((_, i) => el('span', {
      class: 'ex-pip' + (i < results.length ? (results[i] ? ' ok' : ' bad') : (i === index ? ' now' : '')),
    })));

    stage.append(renderPrompt(ex));

    if (ex.kind === 'matching') return renderMatching(ex);
    if (ex.parts) return renderBuilder(ex);
    if (ex.input) return renderTyping(ex);
    return renderChoices(ex);
  }

  function renderPrompt(ex) {
    const p = ex.prompt || {};
    const box = el('div', { class: 'prompt' });
    if (p.label) box.append(el('p', { class: 'prompt-label' }, p.label));

    if (p.speak) {
      const btn = el('button', {
        class: 'speak-btn', type: 'button', 'aria-label': 'Play audio',
        onclick: () => speak(p.speak),
      }, icon('sound'), el('span', {}, 'Play'));
      box.append(btn);
      // Autoplay the first time so the exercise starts by hearing it.
      setTimeout(() => speak(p.speak), 220);
    }
    if (p.glyph) {
      box.append(el('p', { class: 'prompt-glyph' + (p.glyphSize === 'sentence' ? ' sentence' : '') }, p.glyph));
      if (p.sub) box.append(el('p', { class: 'prompt-sub jp' }, p.sub));
    }
    if (p.text) box.append(el('p', { class: 'prompt-text' + (p.text.length <= 12 ? ' short' : '') }, p.text));
    if (p.before !== undefined) {
      box.append(el('p', { class: 'prompt-glyph cloze jp' },
        p.before, el('span', { class: 'gap' }, '　'), p.after));
      if (p.sub) box.append(el('p', { class: 'prompt-sub' }, p.sub));
    }
    return box;
  }

  function renderChoices(ex) {
    const wrap = el('div', { class: 'choices' + (ex.choiceStyle === 'glyph' ? ' glyph' : ex.choiceStyle === 'jp' ? ' jp' : '') });
    for (const c of ex.choices) {
      const b = el('button', { class: 'choice', type: 'button' }, c);
      b.addEventListener('click', () => {
        if (answered) return;
        const ok = c === ex.answer;
        for (const other of wrap.children) {
          other.disabled = true;
          if (other.textContent === ex.answer) other.classList.add('right');
        }
        if (!ok) b.classList.add('wrong');
        settle(ex, ok);
      });
      wrap.append(b);
    }
    stage.append(wrap);
  }

  function renderTyping(ex) {
    const input = el('input', {
      class: 'typed', type: 'text', autocomplete: 'off', autocapitalize: 'off',
      autocorrect: 'off', spellcheck: 'false', 'aria-label': ex.prompt.label,
      placeholder: ex.input === 'romaji' ? 'romaji' : '',
    });
    const submit = el('button', { class: 'btn primary', type: 'button' }, 'Check');
    const form = el('div', { class: 'typing' }, input, submit);
    const go = () => {
      if (answered) return;
      const ok = ex.check ? ex.check(input.value) : input.value.trim() === ex.answer;
      input.disabled = true;
      input.classList.add(ok ? 'right' : 'wrong');
      submit.remove();
      settle(ex, ok);
    };
    input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) go(); });
    submit.addEventListener('click', go);
    stage.append(form);
    setTimeout(() => input.focus({ preventScroll: true }), 30);
  }

  function renderBuilder(ex) {
    const answerRow = el('div', { class: 'build-answer', 'aria-label': 'Your sentence' });
    const pool = el('div', { class: 'build-pool' });
    const chosen = [];

    const refresh = () => {
      clear(answerRow);
      if (!chosen.length) answerRow.append(el('span', { class: 'build-placeholder' }, 'Tap the pieces in order'));
      chosen.forEach((part, i) => {
        answerRow.append(el('button', {
          class: 'chip jp', type: 'button', onclick: () => { if (!answered) { chosen.splice(i, 1); refresh(); } },
        }, part));
      });
      check.disabled = chosen.length !== ex.parts.length;
    };

    for (const part of ex.parts) {
      const b = el('button', { class: 'chip jp pool', type: 'button' }, part);
      b.addEventListener('click', () => {
        if (answered) return;
        b.disabled = true;
        chosen.push(part);
        b.dataset.slot = chosen.length - 1;
        refresh();
      });
      pool.append(b);
    }

    const check = el('button', { class: 'btn primary', type: 'button', disabled: true }, 'Check');
    check.addEventListener('click', () => {
      if (answered) return;
      const ok = chosen.join('') === ex.answer;
      answerRow.classList.add(ok ? 'right' : 'wrong');
      for (const b of pool.children) b.disabled = true;
      check.remove();
      settle(ex, ok, ok ? null : ex.answer + ex.tail);
    });

    stage.append(answerRow, pool, el('div', { class: 'build-actions' }, check));
    refresh();
  }

  function renderMatching(ex) {
    const leftCol = el('div', { class: 'match-col' });
    const rightCol = el('div', { class: 'match-col' });
    let selected = null;
    let solved = 0;
    const total = ex.pairs.length;

    for (const p of ex.pairs) {
      const b = el('button', { class: 'match jp', type: 'button' }, p.left);
      b.dataset.key = p.left;
      b.addEventListener('click', () => {
        if (b.disabled) return;
        for (const o of leftCol.children) o.classList.remove('sel');
        b.classList.add('sel');
        selected = p;
      });
      leftCol.append(b);
    }
    for (const r of ex.rights) {
      const b = el('button', { class: 'match', type: 'button' }, r);
      b.addEventListener('click', () => {
        if (b.disabled || !selected) return;
        const ok = selected.right === r;
        const leftBtn = [...leftCol.children].find(x => x.dataset.key === selected.left);
        if (ok) {
          b.disabled = true; b.classList.add('right');
          leftBtn.disabled = true; leftBtn.classList.add('right'); leftBtn.classList.remove('sel');
          grade(selected.conceptId, ex.conceptType, true);
          solved++;
          selected = null;
          if (solved === total) settle(ex, true);
        } else {
          b.classList.add('shake');
          setTimeout(() => b.classList.remove('shake'), 400);
          grade(selected.conceptId, ex.conceptType, false);
        }
      });
      rightCol.append(b);
    }
    stage.append(el('div', { class: 'match-grid' }, leftCol, rightCol));
  }

  function settle(ex, ok, correction) {
    answered = true;
    results.push(ok);
    if (ex.conceptId) grade(ex.conceptId, ex.conceptType, ok, { hinted: usedHint });

    feedback.className = 'ex-feedback ' + (ok ? 'ok' : 'bad');
    const lines = [el('p', { class: 'verdict' }, ok ? 'Correct' : 'Not quite')];
    if (!ok) {
      lines.push(el('p', { class: 'answer jp' }, correction || ex.answer));
      if (ex.kind === 'kana-recognition' || ex.kind === 'kana-type') {
        // nothing extra — the romaji is the answer
      } else if (ex.answer && /[ぁ-んァ-ヶー]/.test(ex.answer)) {
        lines.push(el('p', { class: 'answer-romaji' }, toRomaji(ex.answer)));
      }
    }
    if (ex.explain) lines.push(el('p', { class: 'explain' }, ex.explain));
    feedback.append(...lines);

    const next = el('button', { class: 'btn primary', type: 'button' },
      index === exercises.length - 1 ? 'Finish' : 'Next');
    next.addEventListener('click', () => { index++; render(); });
    clear(footer).append(next);
    setTimeout(() => next.focus({ preventScroll: true }), 30);
  }

  function finish() {
    const correct = results.filter(Boolean).length;
    const pct = results.length ? Math.round((correct / results.length) * 100) : 0;
    clear(stage); clear(feedback); clear(footer); clear(bar);
    label.textContent = '';
    stage.append(
      el('div', { class: 'session-summary' },
        el('p', { class: 'summary-score' }, `${correct} / ${results.length}`),
        el('p', { class: 'summary-pct' }, `${pct}% correct`),
        el('p', { class: 'summary-note' },
          pct === 100 ? 'Clean run. Those items will come back later, spaced further out.'
          : pct >= 70 ? 'Good. The ones you missed will come back sooner than the rest.'
          : 'The items you missed have dropped back down the queue and will return shortly.'),
      ),
    );
    if (onDone) onDone({ correct, total: results.length, pct });
  }

  return { root };
}

/** Add a "listening" variant to a pool only when the device actually has a Japanese voice. */
const canListen = () => audioAvailable();


__exports.__set({runExercises, canListen, shuffle});
});
  __req('app.js');
})();

</script>
